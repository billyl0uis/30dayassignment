<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silverbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a dark workbench. Tool rail left, soldering board centre, lesson/notes panel right. Mechanisms tab swaps in a 3D viewer. */
:root {
  --bench: #171513;
  --panel: #211e1b;
  --panel-2: #2a2622;
  --line: #3a3430;
  --ink: #efe9df;
  --muted: #a99f91;
  --dim: #7a7166;
  --silver: #d6dadf;
  --flame: #ff8b3d;
  --flame-2: #ffc65c;
  --cool: #7db9ff;
  --ok: #8fd19e;
  --warn: #ffb347;
  --bad: #ff6b5b;
  --ochre: #d9a43b;
  --display: "Fraunces", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bench); color: var(--ink);
  font: 15px/1.5 var(--body);
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--flame-2); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- header ---------- */
.top {
  display: flex; align-items: center; gap: 18px;
  padding: 10px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-left));
  border-bottom: 1px solid var(--line); background: #1b1917;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 700 22px/1 var(--display); letter-spacing: -0.01em; }
.brand b i { font-style: normal; color: var(--flame); }
.brand em { font-style: normal; color: var(--dim); font-size: 13px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; background: var(--panel); padding: 3px; border-radius: 10px; border: 1px solid var(--line); }
.tabs button {
  border: 0; background: none; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500;
}
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.top-actions { margin-left: auto; display: flex; gap: 6px; }
.chipbtn {
  border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted);
}
.chipbtn:hover { color: var(--ink); border-color: #554c44; }

/* ---------- bench view ---------- */
main { min-height: 0; position: relative; }
.view { position: absolute; inset: 0; }
#benchView { display: grid; grid-template-columns: 84px 1fr 340px; min-height: 0; }
#rail {
  border-right: 1px solid var(--line); background: #1b1917; overflow-y: auto; padding: 8px 6px 16px;
  display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin;
}
#rail h4 { margin: 10px 0 2px; font: 600 10px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); text-align: center; }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 6px; border-radius: 9px;
  border: 1px solid transparent; background: none; cursor: pointer; color: var(--muted); font-size: 11px; line-height: 1.1; position: relative;
}
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--panel); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--panel-2); color: var(--flame-2); border-color: #4a3f33; }
.tool.want::after {
  content: ""; position: absolute; inset: -2px; border-radius: 11px; border: 2px solid var(--flame);
  animation: pulse 1.4s ease-in-out infinite;
}
.tool kbd { font: 500 9px var(--mono); color: var(--dim); }
@keyframes pulse { 50% { opacity: .25; } }

#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #2a241f 0%, #171513 70%); }
#bench { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#bench.grab { cursor: grab; } #bench.grabbing { cursor: grabbing; } #bench.torch { cursor: none; }

#opts {
  position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  background: rgba(27,25,23,.92); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; backdrop-filter: blur(6px);
}
#opts .hint { color: var(--muted); font-size: 13px; flex: 1 1 220px; min-width: 0; }
#opts .hint b { color: var(--ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 9px; font-size: 12px; cursor: pointer; color: var(--muted); font-family: var(--mono); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--flame-2); }
.seglabel { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-right: 6px; }
.heat { flex: 1 1 100%; position: relative; height: 30px; }
.heat .bar {
  position: absolute; left: 0; right: 0; top: 4px; height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, #39424d 0%, #3d3a3a 44%, #5e1a10 52%, #a8260d 64%, #e2531a 77%, #ff8f3a 88%, #ffd38a 100%);
}
.heat .tick { position: absolute; top: 0; height: 14px; width: 1px; background: rgba(255,255,255,.35); }
.heat .tick span { position: absolute; top: 15px; transform: translateX(-50%); font: 500 9.5px var(--mono); color: var(--dim); white-space: nowrap; }
.heat .tick.hi span { color: var(--ink); }
.heat .marker { position: absolute; top: -2px; width: 3px; height: 18px; margin-left: -1px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 6px rgba(255,255,255,.6); transition: left .08s linear; }
.heat .readout { position: absolute; right: 0; top: -18px; font: 500 11px var(--mono); color: var(--muted); }

#tip {
  position: absolute; pointer-events: none; z-index: 3; min-width: 150px; max-width: 240px;
  background: rgba(20,18,16,.94); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font-size: 12px; color: var(--muted);
}
#tip b { display: block; color: var(--ink); font-size: 13px; font-weight: 600; }
#tip .t { font: 500 18px var(--mono); color: var(--ink); }
#tip .state { display: block; }

#toasts { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 4; width: min(560px, calc(100% - 32px)); pointer-events: none; }
.toast {
  background: rgba(26,24,22,.96); border: 1px solid var(--line); border-left: 3px solid var(--cool); border-radius: 9px; padding: 8px 12px; font-size: 13.5px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); animation: tin .25s ease-out; max-width: 100%;
}
.toast.good { border-left-color: var(--ok); } .toast.warn { border-left-color: var(--warn); } .toast.bad { border-left-color: var(--bad); }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .35s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

#zoomCtl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
#zoomCtl button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: rgba(27,25,23,.9); cursor: pointer; color: var(--muted); font: 500 15px var(--mono); }
#zoomCtl button:hover { color: var(--ink); }

/* ---------- side panel ---------- */
aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px 18px 28px; min-height: 0; scrollbar-width: thin; }
aside h2 { font: 700 22px/1.15 var(--display); margin: 0 0 6px; letter-spacing: -0.01em; }
aside h3 { font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 22px 0 10px; }
aside p { margin: 0 0 10px; color: var(--muted); }
aside p b, aside li b { color: var(--ink); font-weight: 600; }
.lede { font-size: 14px; }
.lesson-card {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
}
.lesson-card:hover { border-color: #5c4f42; }
.lesson-card strong { display: block; font: 600 15px var(--display); }
.lesson-card span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.lesson-card .meta { font: 500 11px var(--mono); color: var(--flame-2); margin-top: 6px; }
.lesson-card.done strong::after { content: "  ✓"; color: var(--ok); }
table.chart { width: 100%; border-collapse: collapse; font-size: 13px; }
table.chart td { padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
table.chart td:last-child { text-align: right; font-family: var(--mono); color: var(--ink); }
table.chart .sw { display: inline-block; width: 10px; height: 8px; border-radius: 2px; margin-right: 8px; vertical-align: 0; border: 1px solid rgba(0,0,0,.4); }
.steps { list-style: none; padding: 0; margin: 14px 0 0; counter-reset: s; }
.steps li { position: relative; padding: 0 0 12px 34px; color: var(--dim); font-size: 13.5px; counter-increment: s; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
  display: grid; place-items: center; font: 500 11px var(--mono); color: var(--dim);
}
.steps li.done { color: var(--muted); }
.steps li.done::before { content: "✓"; background: #2f3b31; border-color: #3f5a44; color: var(--ok); }
.steps li.now { color: var(--ink); font-size: 15px; }
.steps li.now::before { border-color: var(--flame); color: var(--flame-2); background: #3a2a1d; }
.steps li.now .why { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }
.steps li:not(.now) .why { display: none; }
.steps li.later { opacity: .55; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: #5c4f42; }
.btn.primary { background: var(--flame); color: #1d120a; border-color: var(--flame); font-weight: 600; }
.btn.primary:hover { background: var(--flame-2); }
.btn.quiet { background: none; color: var(--muted); }
.progress { display: flex; gap: 4px; margin: 10px 0 2px; }
.progress i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.progress i.on { background: var(--flame); }
.note { font-size: 12.5px; color: var(--dim); }
kbd.k { font: 500 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 13px; color: var(--muted); align-items: center; }
.legend i { width: 18px; height: 10px; border-radius: 3px; display: block; }

/* ---------- mechanisms ---------- */
#mechView { display: grid; grid-template-columns: 1fr 380px; }
#mechStage { position: relative; min-width: 0; background: radial-gradient(90% 80% at 50% 45%, #3a332c 0%, #1d1a17 65%, #141210 100%); }
#mech3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#mech3d:active { cursor: grabbing; }
.mech-hint { position: absolute; left: 16px; bottom: 14px; font-size: 12px; color: var(--dim); pointer-events: none; }
.mech-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.mech-list button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.mech-list button[aria-selected="true"] { color: #1d120a; background: var(--silver); border-color: var(--silver); font-weight: 600; }
.slider { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
.slider input { width: 100%; accent-color: var(--flame); }
.slider output { font: 500 12px var(--mono); color: var(--ink); min-width: 70px; text-align: right; }
ol.make { padding-left: 20px; margin: 0; }
ol.make li { margin-bottom: 8px; color: var(--muted); font-size: 14px; }

/* ---------- narrow screens ---------- */
@media (max-width: 860px) {
  .brand em { display: none; }
  .top { flex-wrap: wrap; gap: 10px; }
  .top-actions { margin-left: 0; }
  #benchView { grid-template-columns: 1fr; grid-template-rows: minmax(0,1fr) auto auto; }
  #stage { grid-row: 1; }
  #rail { grid-row: 2; flex-direction: row; overflow-x: auto; overflow-y: hidden; border-right: 0; border-top: 1px solid var(--line); padding: 4px 8px; }
  #rail h4 { display: none; }
  .tool { min-width: 58px; }
  #benchView > aside { grid-row: 3; max-height: 34vh; border-left: 0; border-top: 1px solid var(--line); padding: 14px 16px 20px; }
  #opts { left: 8px; right: 8px; bottom: 8px; padding: 7px 9px; gap: 6px 10px; }
  #opts .hint { font-size: 12px; }
  #mechView { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 48vh) 1fr; }
  #mechView > aside { border-left: 0; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { .tool.want::after { animation: none; } .toast { animation: none; } }
</style>

<header class="top">
  <div class="brand"><b>Silver<i>bench</i></b><em>a jeweler's bench simulator</em></div>
  <nav class="tabs" role="tablist" aria-label="View">
    <button role="tab" data-view="bench" aria-selected="true">Bench</button>
    <button role="tab" data-view="mech" aria-selected="false">Mechanisms</button>
  </nav>
  <div class="top-actions">
    <button class="chipbtn" id="undoBtn" title="Undo (Ctrl/⌘ Z)">Undo</button>
    <button class="chipbtn" id="clearBtn">Clear bench</button>
    <button class="chipbtn" id="soundBtn" aria-pressed="true">Sound on</button>
  </div>
</header>

<main>
  <section id="benchView" class="view">
    <nav id="rail" aria-label="Tools"></nav>
    <div id="stage">
      <canvas id="bench" aria-label="Soldering board. Use the tools to make and join silver pieces."></canvas>
      <div id="tip" hidden></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="zoomCtl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit board">⤢</button></div>
      <div id="opts"></div>
    </div>
    <aside id="side"></aside>
  </section>

  <section id="mechView" class="view" hidden>
    <div id="mechStage"><canvas id="mech3d" aria-label="3D view of the selected mechanism"></canvas><div class="mech-hint">Drag to orbit · scroll or pinch to zoom</div></div>
    <aside id="mechSide">
      <div class="mech-list" role="tablist" id="mechList"></div>
      <h2 id="mName"></h2>
      <p class="lede" id="mBlurb"></p>
      <label class="slider"><span id="mSlLabel"></span><input type="range" id="mSlider" min="0" max="1000" value="0"><output id="mSlState"></output></label>
      <div class="row"><button class="btn" id="mPlay">Play</button><button class="btn" id="mExplode" aria-pressed="false">Exploded view</button></div>
      <h3>Why it works</h3>
      <p id="mWhy"></p>
      <h3>How it's made</h3>
      <ol class="make" id="mSteps"></ol>
      <div class="row" id="mLessonRow"><button class="btn primary" id="mLesson">Build one on the bench →</button></div>
    </aside>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const DPR = Math.min(2, window.devicePixelRatio || 1);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const fmt = v => (Math.round(v * 10) / 10).toString();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   Metallurgy. Temperatures in °C, sizes in mm.
   Sterling silver solder flow points are the common US hard/medium/easy/extra-easy grades.
   ===================================================================== */
const AMBIENT = 20;
const SILVER = { glow: 430, fluxClear: 595, anneal: 650, solidus: 802, liquidus: 893 };
const SOLDERS = {
  hard:   { name: 'Hard',       flow: 788, letter: 'H', color: '#eceef0' },
  medium: { name: 'Medium',     flow: 754, letter: 'M', color: '#e6e2d8' },
  easy:   { name: 'Easy',       flow: 718, letter: 'E', color: '#e4d9c2' },
  xeasy:  { name: 'Extra easy', flow: 688, letter: 'X', color: '#dfcca6' },
};
const RHO_C = 2.45e-3;          // J/(K·mm³): sterling density × specific heat
const TOUCH = 0.25;             // gap in mm that still counts as touching
const TIPS = {
  small:  { label: 'Small',  P: 70,  sigma: 2.8 },
  medium: { label: 'Medium', P: 120, sigma: 5.5 },
  large:  { label: 'Large',  P: 260, sigma: 9 },
};

// Decides what a solder chip does right now, given the chip and the metal pieces it touches.
// Return 'flow' (melts and runs into the seam), 'ball' (melts but beads up instead of wetting), or 'wait'.
// chip: { grade, temp, flux }   metals[i]: { temp, flux, oxide, kind }   SOLDERS[chip.grade].flow is the flow point.
function solderVerdict(chip, metals) {
  const flow = SOLDERS[chip.grade].flow;
  if (chip.temp < flow) return 'wait';
  // the metal has to be at flow temperature too; a chip melting on cold work just beads up
  const hot = metals.filter(m => m.temp >= flow - 10);
  if (!hot.length) return 'ball';
  // solder only wets clean, fluxed metal: no flux, or oxide the flux couldn't hold off, means a bead
  const fluxed = chip.flux > 0 || hot.some(m => m.flux > 0.15);
  if (!fluxed) return 'ball';
  if (hot.every(m => m.oxide > 0.5)) return 'ball';
  return 'flow';
}

/* =====================================================================
   Geometry
   ===================================================================== */
function toLocal(p, wx, wy) { const dx = wx - p.x, dy = wy - p.y, c = Math.cos(p.rot), s = Math.sin(p.rot); return [dx * c + dy * s, -dx * s + dy * c]; }
function toWorld(p, lx, ly) { const c = Math.cos(p.rot), s = Math.sin(p.rot); return [p.x + lx * c - ly * s, p.y + lx * s + ly * c]; }
function segDist(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, L = vx * vx + vy * vy;
  const t = L ? clamp(((px - ax) * vx + (py - ay) * vy) / L, 0, 1) : 0;
  return Math.hypot(px - ax - vx * t, py - ay - vy * t);
}
function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function polyEdgeDist(x, y, poly) {
  let d = Infinity;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) d = Math.min(d, segDist(x, y, poly[j][0], poly[j][1], poly[i][0], poly[i][1]));
  return d;
}
function boxDist(x, y, hw, hh) {
  const dx = Math.abs(x) - hw, dy = Math.abs(y) - hh;
  return Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) + Math.min(Math.max(dx, dy), 0);
}
function polyArea(poly) { let a = 0; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) a += poly[j][0] * poly[i][1] - poly[i][0] * poly[j][1]; return a / 2; }
function centroid(poly) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const f = poly[j][0] * poly[i][1] - poly[i][0] * poly[j][1];
    a += f; cx += (poly[j][0] + poly[i][0]) * f; cy += (poly[j][1] + poly[i][1]) * f;
  }
  if (Math.abs(a) < 1e-6) return [poly.reduce((s, p) => s + p[0], 0) / poly.length, poly.reduce((s, p) => s + p[1], 0) / poly.length];
  return [cx / (3 * a), cy / (3 * a)];
}
// keep the side of the polygon where n·v >= c (Sutherland–Hodgman against one half-plane)
function clipHalf(poly, nx, ny, c) {
  const out = [], f = v => v[0] * nx + v[1] * ny - c;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], fa = f(a), fb = f(b);
    if (fa >= 0) out.push(a);
    if ((fa >= 0) !== (fb >= 0)) { const t = fa / (fa - fb); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  }
  return out;
}
const rectPoly = (w, h) => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
const discPoly = r => { const n = clamp(Math.round(r * 5), 24, 80); return Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2; return [Math.cos(a) * r, Math.sin(a) * r]; }); };

/* =====================================================================
   Parts
   ===================================================================== */
const S = { parts: [], joints: [], nextId: 1, hinge: {} };   // hinge: pinId -> { angle, mover }

const mkRect = (x, y, w, h, t, rot = 0) => newPart('sheet', { x, y, rot, t, holes: [], domed: false, shape: 'rect', w, h, poly: rectPoly(w, h) });

const mkTube = (x, y, len, od, bore, rot = 0) => newPart('tube', { x, y, rot, len, od, bore });

function dirty(p) { delete p._lo; delete p._ls; delete p._br; delete p._C; delete p._A; }

function localDist(p, x, y) {

// interior sample points [x, y, areaWeight] used for torch heating
function samples(p) {

/* =====================================================================
   Contacts, rigid groups, assemblies, hinges, pivots
   ===================================================================== */
function contactPoint(A, B) {

function rebuild() {

/* =====================================================================
   Undo, save
   ===================================================================== */
const undoStack = [];
const snap = () => JSON.stringify(S, (k, v) => k[0] === '_' ? undefined : v);
function load(json) {
  const d = JSON.parse(json);
  S.parts = d.parts || []; S.joints = d.joints || []; S.nextId = d.nextId || 1; S.hinge = d.hinge || {};
  S.parts.forEach(p => { p.pools = p.pools || []; if (p.kind === 'sheet') p.holes = p.holes || []; });

function pushUndo() { undoStack.push(snap()); if (undoStack.length > 60) undoStack.shift(); }
function undo() { if (!undoStack.length) return toast('Nothing to undo.'); load(undoStack.pop()); torch.firing = false; }
const SAVE_KEY = 'silverbench.bench.v1';
function save() { if (lesson) return; try { localStorage.setItem(SAVE_KEY, snap()); } catch (e) {} }

/* =====================================================================
   Sound (Web Audio, synthesized)
   ===================================================================== */
const SFX = (() => {
  let ac = null, on = true, noiseBuf = null, roar = null;
  function ensure() {
    if (ac || !on) return ac;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }

    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ac;
  }
  function noise(dur, type, freq, q, gain, attack = 0.005) {
    if (!ensure()) return;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(), t = ac.currentTime;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t + dur + 0.05);
  }
  function tone(freq, dur, gain, type = 'sine') {
    if (!ensure()) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    ensure,
    get on() { return on; },
    toggle() { on = !on; if (!on) this.torch(false); return on; },
    torch(fire) {
      if (!on || !ensure()) { if (roar) { roar.g.gain.setTargetAtTime(0, ac.currentTime, 0.05); } return; }
      if (!roar) {
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 0.6;
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
        const g = ac.createGain(); g.gain.value = 0;
        src.connect(f).connect(lp).connect(g).connect(ac.destination); src.start();
        roar = { g };
      }
      roar.g.gain.setTargetAtTime(fire ? 0.16 : 0, ac.currentTime, fire ? 0.04 : 0.08);
    },
    ting() { tone(2093, 0.5, 0.06); tone(3136, 0.35, 0.03); },
    hiss() { noise(1.1, 'highpass', 3000, 0.4, 0.22, 0.01); },
    fizz() { noise(0.8, 'bandpass', 5200, 1.5, 0.08, 0.05); },
    rasp() { for (let i = 0; i < 3; i++) setTimeout(() => noise(0.09, 'bandpass', 2600, 2, 0.12), i * 110); },
    tink() { tone(1760, 0.18, 0.08, 'triangle'); tone(2637, 0.12, 0.04); },
    click() { tone(1200, 0.06, 0.1, 'square'); noise(0.05, 'highpass', 4000, 1, 0.1); },
    drill() { noise(0.45, 'bandpass', 1800, 4, 0.08, 0.02); },
    bad() { tone(140, 0.4, 0.08, 'sawtooth'); },
  };
})();

/* =====================================================================
   Toasts
   ===================================================================== */
const toastSeen = new Map();
function toast(msg, kind = 'info', ms = 4200) {
  const box = $('#toasts');
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.innerHTML = msg;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, ms);
}
function toastKey(key, msg, kind, cooldown = 9000) {
  const now = performance.now();
  if (now - (toastSeen.get(key) || -1e9) < cooldown) return;
  toastSeen.set(key, now); toast(msg, kind, 5200);
}

/* =====================================================================
   Simulation: heat, flux, oxide, solder
   ===================================================================== */
const torch = { x: 0, y: 0, firing: false, on: false };

function torchHeat(p) {
  const tip = TIPS[opt.tip], s2 = 2 * tip.sigma * tip.sigma, norm = tip.P / (Math.PI * s2);
  if (Math.hypot(p.x - torch.x, p.y - torch.y) - br(p) > tip.sigma * 3.2) return 0;
  const c = Math.cos(p.rot), s = Math.sin(p.rot); let q = 0;
  for (const [lx, ly, w] of samples(p)) {
    const dx = p.x + lx * c - ly * s - torch.x, dy = p.y + lx * s + ly * c - torch.y;
    q += w * Math.exp(-(dx * dx + dy * dy) / s2);
  }
  return q * norm;
}

function physics(dt) {
  const P = S.parts; if (!P.length) return;
  if (!torch.firing && !P.some(p => p.temp > AMBIENT + 0.3)) return;
  const n = Math.max(1, Math.ceil(dt / 0.008)), h = dt / n, Tamb4 = 293.15 ** 4;
  for (let k = 0; k < n; k++) {
    for (const p of P) p._q = torch.firing ? torchHeat(p) : 0;
    for (const c of derived.contacts) {
      const dT = c.a.temp - c.b.temp, Ca = cap(c.a), Cb = cap(c.b);
      let e = c.G * dT * h; const lim = 0.45 * Math.abs(dT) * Ca * Cb / (Ca + Cb);
      if (Math.abs(e) > lim) e = Math.sign(e) * lim;
      c.a._q -= e / h; c.b._q += e / h;
    }
    for (const p of P) {
      const Tk = p.temp + 273.15;
      p._q -= surf(p) * (1e-5 * (p.temp - AMBIENT) + 1.7e-14 * (Tk ** 4 - Tamb4));
      p.temp = Math.max(AMBIENT, p.temp + p._q * h / cap(p));
    }
  }
}

function chemistry(dt) {
  let melted = false;
  for (const p of S.parts) {
    if (p.flux > 0) {
      if (p.temp > 100) p.fluxDry = true;
      if (p.temp >= SILVER.fluxClear) p.glass = true;
      if (p.temp > 620) p.flux = Math.max(0, p.flux - dt * (p.temp > 850 ? 0.06 : 0.012));
      if (p.temp > 100 && p.temp < 300 && Math.random() < dt * 10) { const s = samples(p), pt = s[(Math.random() * s.length) | 0]; const [wx, wy] = toWorld(p, pt[0], pt[1]); spawn('bubble', wx, wy); }
    }
    if (p.kind === 'chip') continue;
    if (p.temp > 350) { const protect = p.flux > 0.15 ? 0.12 : 1; p.oxide = Math.min(1, p.oxide + dt * protect * 0.1 * (p.temp - 350) / 400); }
    if (p.temp > 450 && p.surface !== 'fired') p.surface = 'fired';
    if (p.temp > SILVER.solidus) {
      p.burn = Math.min(1, p.burn + dt * 0.6);
      toastKey('sweat' + p.id, `The ${partName(p).toLowerCase()} is at ${Math.round(p.temp)}°C and its surface is starting to sweat. Sterling melts at 893°C, so <b>pull the flame away</b>.`, 'bad', 6000);
      if (Math.random() < dt * 20) spawn('spark', p.x + (Math.random() - .5) * br(p), p.y + (Math.random() - .5) * br(p));
    }
    if (p.temp >= SILVER.liquidus && p.kind !== 'rivet') { meltPart(p); melted = true; }
  }

}

  const n = 36, poly = [];

const parts2 = [];

    const a = Math.random() * Math.PI * 2, sp = type === 'spark' ? 8 + Math.random() * 18 : type === 'sparkle' ? 3 + Math.random() * 6 : 1;
    parts2.push({ type, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: type === 'steam' ? 1.6 + Math.random() : type === 'bubble' ? 0.6 : 0.7, r: type === 'steam' ? 2 + Math.random() * 3 : 0.25 + Math.random() * 0.3 });

const burst = (x, y) => spawn('sparkle', x, y, 14);
function stepParticles(dt) {

function snapToGhost(members) {
  if (!lesson || !lesson.def.snaps || members.length !== 1) return;
  const p = members[0];
  for (const s of lesson.def.snaps) {
    if (p.kind !== s.kind) continue;
    const da = Math.abs(Math.atan2(Math.sin(2 * (p.rot - s.rot)), Math.cos(2 * (p.rot - s.rot)))) / 2;
    if (Math.hypot(p.x - s.x, p.y - s.y) < 3 && da < 0.35 && !S.parts.some(q => q !== p && q.kind === s.kind && Math.hypot(q.x - s.x, q.y - s.y) < 0.9)) {
      p.x = s.x; p.y = s.y; p.rot = s.rot; dirty(p); SFX.click(); return;
    }
  }
}

  const rodX = (r, len, mat) => new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 28).rotateZ(Math.PI / 2), mat);

  const BUILD = {
    hinge(g) {
      const A = new THREE.Group(), B = new THREE.Group(), pin = new THREE.Group(); g.add(A, B, pin);
      A.add(box(28, 0.8, 13, M.satin, 0, -1.1, -8.05));
      const kg = tubeGeoX(0.75, 1.5, 8.6);
      const k1 = mesh(kg, M.silver, -9.2, 0, 0), k3 = mesh(kg, M.silver, 9.2, 0, 0), k2 = mesh(kg, M.silver, 0, 0, 0);
      A.add(k1, k3); B.add(k2);
      [-9.2, 9.2].forEach(x => { const f = rodX(0.35, 8.2, M.solder); f.position.set(x, -0.95, -1.45); A.add(f); });
      const f2 = rodX(0.35, 8.2, M.solder); f2.position.set(0, -0.95, 1.45); B.add(f2);
      B.add(box(28, 0.8, 13, M.satin, 0, -1.1, 8.05));
      pin.add(rodX(0.7, 28.6, M.dark));
      [-14.3, 14.3].forEach(x => { const h = mesh(new THREE.SphereGeometry(0.95, 20, 12), M.silver, x, 0, 0); h.scale.set(0.45, 1, 1); pin.add(h); });
      return { cam: { dist: 62, ty: 0 }, floor: -2.2, update(t, e) {
        B.rotation.x = -t * Math.PI * 0.985;
        A.position.z = -5 * e; B.position.z = 5 * e * Math.cos(B.rotation.x); B.position.y = 5 * e * Math.sin(-B.rotation.x) * -1;
        k1.position.x = -9.2 - 3 * e; k3.position.x = 9.2 + 3 * e;
        pin.position.x = 34 * e;
        return t > 0.97 ? 'Closed' : t < 0.03 ? 'Open flat' : Math.round(180 - t * 177) + '°';
      } };
    },
    box(g) {
      const boxG = new THREE.Group(), top = new THREE.Group(), tongue = new THREE.Group(), upper = new THREE.Group(); g.add(boxG, tongue); boxG.add(top);
      boxG.add(box(12.5, 0.5, 9, M.satin, 6, -0.25, 0));
      [-4.25, 4.25].forEach(z => boxG.add(box(12.5, 4.7, 0.5, M.satin, 6, 2.1, z)));
      boxG.add(box(0.5, 4.7, 9, M.satin, 12.25, 2.1, 0));
      // front lip with a centre slot for the thumb piece
      [-2.85, 2.85].forEach(z => boxG.add(box(0.5, 1.6, 3.3, M.silver, -0.25, 3.4, z)));
      top.add(box(9.5, 0.5, 9, M.satin, 7.5, 4.45, 0));
      [-2.85, 2.85].forEach(z => top.add(box(3, 0.5, 3.3, M.satin, 1.25, 4.45, z)));
      const loop = mesh(new THREE.TorusGeometry(1.4, 0.4, 12, 32), M.silver, 14, 2.1, 0); loop.rotation.y = Math.PI / 2; boxG.add(loop);
      // tongue: end cap + lower leaf + springy upper leaf hinged at the tip
      tongue.add(box(1.5, 5.4, 9.6, M.satin, -0.75, 2.1, 0));
      const loop2 = mesh(new THREE.TorusGeometry(1.4, 0.4, 12, 32), M.silver, -2.6, 2.1, 0); loop2.rotation.y = Math.PI / 2; tongue.add(loop2);
      tongue.add(box(11, 0.4, 6.5, M.silver, 5.5, 0.3, 0));
      upper.position.set(11, 0.5, 0); tongue.add(upper);
      upper.add(box(9, 0.4, 6.5, M.silver, -4.5, 0.2, 0));
      upper.add(box(0.9, 2.4, 2, M.silver, -8.6, 1.4, 0));
      upper.add(mesh(new THREE.SphereGeometry(1.05, 20, 12), M.silver, -8.6, 2.7, 0));
      const fold = mesh(new THREE.CylinderGeometry(0.4, 0.4, 6.5, 16).rotateX(Math.PI / 2), M.silver, 11, 0.5, 0); tongue.add(fold);
      const a0 = Math.atan(2.9 / 9); let locked = false;
      return { cam: { dist: 56, ty: 2, theta: 0.95, phi: 1.0 }, floor: -0.6, update(t, e) {
        const off = -14 + 13.5 * t - 8 * e; tongue.position.x = off;
        const tip = off + 11, dLip = tip + 0.25;
        let a = a0, isLocked = false;
        if (dLip > 0 && dLip < 9) a = Math.min(a0, Math.atan(1.7 / dLip));
        else if (dLip >= 9) isLocked = true;
        upper.rotation.z = -a;
        top.position.y = 6 * e;
        if (isLocked && !locked && e < 0.1) SFX.click();
        locked = isLocked;
        return isLocked ? 'Locked' : dLip > 0 ? 'Squeezing' : 'Apart';
      } };
    },
    toggle(g) {
      const ring = mesh(new THREE.TorusGeometry(6, 0.85, 20, 64), M.silver); g.add(ring);
      const lk = mesh(new THREE.TorusGeometry(1.2, 0.35, 12, 32), M.silver, -7.5, 0, 0); lk.rotation.y = Math.PI / 2; g.add(lk);
      const bar = new THREE.Group(); g.add(bar);
      bar.add(rodX(0.8, 15, M.silver));
      [-7.5, 7.5].forEach(x => bar.add(mesh(new THREE.SphereGeometry(1.25, 24, 16), M.silver, x, 0, 0)));
      const eye = mesh(new THREE.TorusGeometry(0.9, 0.3, 12, 28), M.silver, 0, 0, 1.6); eye.rotation.y = Math.PI / 2; bar.add(eye);
      const chain = new THREE.Group(); g.add(chain);
      for (let i = 0; i < 4; i++) { const c = mesh(new THREE.TorusGeometry(1.1, 0.3, 10, 24), M.silver); c.rotation.set(0, i % 2 ? 0 : Math.PI / 2, 0); chain.add(c); }
      return { cam: { dist: 40, ty: 0, theta: 0.5, phi: 1.2 }, floor: -7.5, update(t, e) {
        const a = smooth(t / 0.3), b = smooth((t - 0.3) / 0.45), c = smooth((t - 0.75) / 0.25);
        bar.position.set(lerp(14, 0, a), 0, lerp(11, -1.4, b) + 14 * e);
        bar.rotation.y = (a - c) * Math.PI / 2;
        chain.children.forEach((l, i) => { const k = (i + 1) / 5, x = bar.position.x; l.position.set(lerp(x, x + 6, k * k * (1 - c)), 0, bar.position.z + 2.6 + i * 2); });
        return t > 0.97 ? 'Locked across' : t > 0.3 ? 'End-first' : 'Free';
      } };
    },
    rivet(g) {
      const p1 = box(18, 1, 6, M.satin, 0, 0.5, 0), p2 = box(18, 1, 6, M.satin, 0, 1.5, 0); p1.rotation.y = 0.4; p2.rotation.y = -0.4; g.add(p1, p2);
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 1, 24), M.silver); g.add(rod);
      const hTop = mesh(new THREE.SphereGeometry(0.55, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), M.silver), hBot = mesh(new THREE.SphereGeometry(0.55, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), M.silver);
      hBot.rotation.x = Math.PI; g.add(hTop, hBot);
      const anvil = box(10, 2, 8, M.steel, 0, -2.2, 0); g.add(anvil);
      const hammer = new THREE.Group(); hammer.add(mesh(new THREE.CylinderGeometry(1.4, 1.4, 6, 24).rotateZ(Math.PI / 2), M.steel, 0, 0, 0)); hammer.add(box(1.2, 1.2, 18, M.wood, 1.5, 0, 9.5));
      hammer.children[0].position.x = 0; g.add(hammer);
      let taps = 0;
      return { cam: { dist: 44, ty: 1.5, theta: 0.6, phi: 1.15 }, floor: -3.3, update(t, e) {
        const k = smooth(t), proud = 0.6 * (1 - k);
        const yTop = 2 + proud, yBot = -proud;
        rod.scale.y = yTop - yBot; rod.position.y = (yTop + yBot) / 2;
        const spread = 1 + 1.15 * k, flat = 1 - 0.35 * k;
        hTop.position.y = yTop; hTop.scale.set(spread, flat, spread);
        hBot.position.y = yBot; hBot.scale.set(spread, flat, spread);
        p2.position.y = 1.5 + 5 * e; hTop.position.y += 5 * e; rod.visible = true;
        anvil.position.y = -2.2 - 0.6 * k - 4 * e;
        const n = t < 0.98 ? Math.abs(Math.sin(t * Math.PI * 6)) : 1;
        hammer.position.set(0, yTop + 1.4 + n * 6, 0); hammer.rotation.x = -0.25 * n; hammer.visible = e < 0.5;
        const tp = Math.floor(t * 6 + 0.5); if (tp !== taps) { if (tp > taps && n < 0.3) SFX.tink(); taps = tp; }
        return t > 0.97 ? 'Riveted' : t < 0.03 ? 'Wire in hole' : 'Mushrooming';
      } };
    },
    spinner(g) {
      const core = new THREE.Group(), band = new THREE.Group(); g.add(core, band);
      core.add(mesh(new THREE.LatheGeometry([new THREE.Vector2(9, -4), new THREE.Vector2(9.8, -4), new THREE.Vector2(9.8, 4), new THREE.Vector2(9, 4), new THREE.Vector2(9, -4)], 96), M.silver));
      const lipGeo = y => new THREE.LatheGeometry([new THREE.Vector2(9.7, y - 0.4), new THREE.Vector2(10.9, y - 0.15 * Math.sign(y)), new THREE.Vector2(10.9, y + 0.05 * Math.sign(y)), new THREE.Vector2(9.7, y + 0.4)], 96);
      const lipT = mesh(lipGeo(3.75), M.silver), lipB = mesh(lipGeo(-3.75), M.silver); core.add(lipT, lipB);
      band.add(mesh(new THREE.LatheGeometry([new THREE.Vector2(9.85, -3.2), new THREE.Vector2(10.5, -3.2), new THREE.Vector2(10.5, 3.2), new THREE.Vector2(9.85, 3.2), new THREE.Vector2(9.85, -3.2)], 96), M.satin));
      for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2, d = mesh(new THREE.SphereGeometry(0.5, 12, 8), M.silver, Math.cos(a) * 10.5, 0, Math.sin(a) * 10.5); band.add(d); }
      [-1.8, 1.8].forEach(y => band.add(mesh(new THREE.TorusGeometry(10.5, 0.18, 8, 96).rotateX(Math.PI / 2), M.silver, 0, y, 0)));
      let spin = 0;
      return { cam: { dist: 70, ty: 0, theta: 0.3, phi: 1.1 }, floor: -5, spin: true, update(t, e, dt) {
        spin += dt * t * 6; band.rotation.y = spin;
        const f = lerp(1, 9.75 / 10.9, e); lipT.scale.set(f, 1, f); lipB.scale.set(f, 1, f);
        band.position.y = 11 * e;
        return t < 0.02 ? 'Still' : Math.round(t * 60) + ' rpm';
      } };
    },
  };

  function select(id) {
    if (!ready) init();
    const def = MECHS.find(m => m.id === id); cur = def;
    holder.clear && holder.clear(); while (holder.children.length) holder.remove(holder.children[0]);
    const g = new THREE.Group(); holder.add(g);
    upd = BUILD[id](g);
    orbit.dist = upd.cam.dist * 1.35; orbit.ty = upd.cam.ty; orbit.theta = upd.cam.theta ?? 0.7; orbit.phi = upd.cam.phi ?? 1.05;
    shadow.position.y = upd.floor; shadow.scale.setScalar(upd.cam.dist * 0.8);
    tVal = 0; exp = expT = 0; playing = false; $('#mPlay').textContent = 'Play'; $('#mExplode').setAttribute('aria-pressed', 'false');
    $('#mSlider').value = 0;
    document.querySelectorAll('#mechList button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
    $('#mName').textContent = def.name; $('#mBlurb').textContent = def.blurb; $('#mWhy').innerHTML = def.why;
    $('#mSlLabel').textContent = def.label;
    $('#mSteps').innerHTML = def.make.map(s => `<li>${s}</li>`).join('');
    $('#mLessonRow').hidden = !def.lesson;
  }
  function size() { if (!ready) return; const r = cvs.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
  function frame(dt) {
    if (!ready || !cur) return;
    if (playing) { tVal += pdir * dt * 0.28; if (tVal >= 1) { tVal = 1; pdir = -1; } if (tVal <= 0) { tVal = 0; pdir = 1; } $('#mSlider').value = tVal * 1000; }
    exp += (expT - exp) * Math.min(1, dt * 6);
    const label = upd.update(tVal, smooth(exp), dt);
    $('#mSlState').textContent = label;
    if (!REDUCED && !playing && !upd.spin) orbit.theta += dt * 0.04;
    const sp = Math.sin(orbit.phi);
    camera.position.set(orbit.dist * sp * Math.sin(orbit.theta), orbit.ty + orbit.dist * Math.cos(orbit.phi), orbit.dist * sp * Math.cos(orbit.theta));
    camera.lookAt(0, orbit.ty, 0);
    renderer.render(scene, camera);
  }
  $('#mechList').innerHTML = MECHS.map(m => `<button role="tab" data-id="${m.id}">${m.name}</button>`).join('');
  $('#mechList').addEventListener('click', e => { const b = e.target.closest('button'); if (b) select(b.dataset.id); });
  $('#mSlider').addEventListener('input', e => { tVal = e.target.value / 1000; playing = false; $('#mPlay').textContent = 'Play'; SFX.ensure(); });
  $('#mPlay').onclick = () => { SFX.ensure(); playing = !playing; $('#mPlay').textContent = playing ? 'Pause' : 'Play'; };
  $('#mExplode').onclick = () => { expT = expT ? 0 : 1; $('#mExplode').setAttribute('aria-pressed', String(!!expT)); };
  $('#mLesson').onclick = () => cur && cur.lesson && startLesson(cur.lesson);
  return {
    show() { if (!ready) { init(); select('hinge'); } requestAnimationFrame(size); },
    size, frame,
  };
})();

/* =====================================================================
   Main loop
   ===================================================================== */
let last = performance.now(), saveTimer = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'bench') {
    physics(dt); chemistry(dt); solderStep(); watchJoints(); stepParticles(dt); lessonTick();
    if (torch.firing && Math.random() < dt * 30) spawn('spark', torch.x + (Math.random() - .5) * 2, torch.y + (Math.random() - .5) * 2);
    drawBench(now); updateTip(); updateHeat();
    if ((saveTimer += dt) > 2) { saveTimer = 0; save(); }
  } else Mech.frame(dt);
  requestAnimationFrame(loop);
}

function demoBench() {
  const disc = mkDisc(-30, 8, 14, 1); disc.domed = true;
  const strip = mkRect(22, -14, 46, 10, 0.8, -0.12);
  const ring = mkRing(-30, -9.5, 3.5, 1);
  const wire = mkWire(24, 14, 36, 1.3, 0.05);
  const tube = mkTube(24, 26, 22, 3.0, 1.5, 0.05);
  return [disc, strip, ring, wire, tube];
}

addEventListener('resize', () => { const fresh = !VW || VW < 2; resize(); if (mode === 'mech') Mech.size(); if (fresh) fit(); });
buildRail(); resize(); setTool('move');
try { const saved = localStorage.getItem(SAVE_KEY); if (saved) load(saved); } catch (e) {}
if (!S.parts.length) { S.parts = demoBench(); rebuild(); }
fit(); renderSide();
toast('Welcome to the bench. Start a lesson on the right, or grab any tool and make something.', 'info', 6000);
requestAnimationFrame(loop);
</script>
