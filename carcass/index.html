/* ========================== STAGE 2: SKINNING ======================== */
const PEEL_REGIONS = [
  { id: 'foreL', label: 'Left foreleg', leg: 'fore' }, { id: 'foreR', label: 'Right foreleg', leg: 'fore' },
  { id: 'hindL', label: 'Left hindleg', leg: 'hind' }, { id: 'hindR', label: 'Right hindleg', leg: 'hind' },
  { id: 'tail', label: 'Tail' }, { id: 'head', label: 'Head & neck' },
  { id: 'flankL', label: 'Left flank' }, { id: 'flankR', label: 'Right flank' },
];
function peelHit(p) {
  for (const r of PEEL_REGIONS) {
    if (r.leg) { const [x1, y1, x2, y2, rad] = VR.legs[r.id]; if (distSeg(p.x, p.y, x1, y1, x2, y2) < rad + 4) return r; }
  }
  if (tailDist(p) < 18 && p.x > 660) return PEEL_REGIONS[4];
  if (inEll(p, VR.head) || (p.x < 130 && Math.abs(p.y - 290) < 25)) return PEEL_REGIONS[5];
  if (inEll(p, VR.body)) return PEEL_REGIONS[p.y < VR.body[1] ? 6 : 7];
  return null;
}

const stageSkin = {
  key: 'skin', title: 'Skinning', short: 'Skin',
  mount(P) {
    const D = DECOMP[S.decomp];
    stageHead(P, 1, 'One long cut down the belly, then peel the hide back off every part of the body.');
    const st = { phase: 'choose', samples: [], depth: 0, last: null, gashes: [], ragged: 0, peel: {}, tension: 0, hold: null, holdT: 0, asking: false, stripTail: null };
    const [[ax, ay], [bx, by]] = VR.incision;
    for (let i = 0; i <= 40; i++) st.samples.push({ x: ax + (bx - ax) * i / 40, y: ay + (by - ay) * i / 40, hit: false });
    PEEL_REGIONS.forEach(r => st.peel[r.id] = 0);
    S.flags.feet = {};

    const body = el('div'); P.append(body);
    const render = () => {
      body.innerHTML = '';
      if (st.phase === 'choose') {
        body.append(el('h3', {}, 'Keep the hide?'), el('p', {}, 'A saved hide can become a study skin or tanned pelt. It means slower, gentler peeling, and it changes what happens at the feet.'));
        body.append(el('div', { class: 'opts' },
          el('button', { class: 'btn opt', onclick: () => choose(true) }, el('b', {}, 'Save the hide'), el('small', {}, 'Side goal. Tears and slips count against the hide grade.')),
          el('button', { class: 'btn opt', onclick: () => choose(false) }, el('b', {}, 'Skeleton only'), el('small', {}, 'Faster. Tears don\'t matter.'))));
      } else if (st.phase === 'incise') {
        body.append(el('h3', {}, 'Ventral incision'),
          el('p', {}, 'Drag along the dashed line from throat to vent. Go slowly: speed is depth. You want through the skin, not the belly wall.', why('Skinners lift the skin and cut blade-edge-up so the knife never drops into the muscle. Opening the abdominal wall now means the gut is exposed while you peel.')));
        st.gaugeEl = el('div', { class: 'gauge' }); body.append(st.gaugeEl);
        st.progEl = el('div', { class: 'stat' }); body.append(st.progEl);
      } else {
        body.append(el('h3', {}, 'Peel'),
          el('p', {}, 'Press and hold on a part of the body to work the hide off it. Tension builds while you pull; let go before it tears.', why('Hide is held on by fascia, a sheet of connective tissue. Steady short pulls let it separate. Long hard pulls tear the skin before the fascia gives.')));
        st.gaugeEl = el('div', { class: 'gauge' }); body.append(st.gaugeEl);
        st.listEl = el('div'); body.append(st.listEl);
      }
    };
    const choose = save => {
      S.saveHide = save;
      log(save ? 'Saving the hide.' : 'Skeleton only; the hide goes in the bin.');
      if (save && D.hideSlip) { addMistake('hide_slip'); S.hide.damage += 35; }
      st.phase = 'incise'; render();
      setHint('Drag slowly along the dashed midline.');
    };
    render();

    nextButton(P, 'Hide is off →', () => st.phase === 'peel' && Object.values(st.peel).every(v => v >= 1), () => { advance(1.5, D.stench + 8); goStage(2); });

    const tailChoice = async () => {
      st.asking = true;
      st.stripTail = await ask('The tail', 'The tail vertebrae sit in a sleeve of skin. You can pull the core out, or cut the sleeve open.', [
        { value: true, label: 'Strip the core out', note: 'Fast. Pull too hard and the last vertebrae snap off inside the skin.' },
        { value: false, label: 'Slit the underside and peel', note: 'Slower, safe. Leaves a seam if you\'re saving the hide.', primary: true },
      ]);
      log(st.stripTail ? 'Stripping the tail.' : 'Slitting the tail skin.');
      st.asking = false;
    };
    const footChoice = async r => {
      st.asking = true;
      const where = r.leg === 'fore' ? 'wrist' : 'ankle';
      const v = await ask(`${r.label}: the foot`, `You've reached the ${where}. Raccoon feet are long-toed and full of tiny bones.`, [
        { value: 'skinout', label: 'Skin out to the last toe joint', note: 'Slow and fiddly. Every bone stays with the skeleton.' },
        { value: 'hide', label: `Cut through at the ${where}`, note: 'The foot stays inside the hide. Standard taxidermy.' },
        { value: 'whole', label: 'Take the foot off whole, skin on', note: 'Macerate it as is; the skin sloughs in the water.' },
      ]);
      S.flags.feet[r.id] = v;
      const ids = r.leg === 'fore' ? ['carpals', 'metacarpals', 'foreph'] : ['tarsals', 'metatarsals', 'hindph'];
      if (v === 'hide') ids.forEach(id => loseBones(id, Math.round(S.bones[id].n / 2), 'feet_in_hide'));
      if (v === 'whole' && S.saveHide) { S.hide.damage += 6; log('The hide is missing a foot now.', 'warn'); }
      if (v === 'whole') log('Foot set aside whole for maceration.');
      if (v === 'skinout') log('Skinning out the toes.');
      st.asking = false;
    };

    // tear: what it means depends on where and why
    const tear = r => {
      SND.tear(); st.tension = .35;
      if (r.id === 'tail' && st.stripTail && !S.flags.tailSnapped) {
        S.flags.tailSnapped = true;
        loseBones('caudal', 3 + Math.floor(Math.random() * 5), 'tail_snapped');
        return;
      }
      if (S.saveHide) { S.hide.damage += 5; addMistake('hide_tear', r.label.toLowerCase()); }
      else log(`Skin tore on the ${r.label.toLowerCase()}. Doesn't matter, you're not keeping it.`);
    };

    scene = {
      smell: [450, 280],
      down(p) {
        if (st.phase === 'incise') { st.last = p; st.depth = 0; st.stroke = { ragged: false, breach: false }; }
        if (st.phase === 'peel' && !st.asking) {
          const r = peelHit(p);
          if (!r || st.peel[r.id] >= 1) return;
          if (r.id === 'tail' && st.stripTail == null) { tailChoice(); return; }
          st.hold = r; st.holdT = 0;
        }
      },
      move(p) {
        if (st.phase !== 'incise' || !pointer.down || !st.last) return;
        const dt = Math.max(1, p.t - st.last.t), d = Math.hypot(p.x - st.last.x, p.y - st.last.y);
        st.depth += (d / dt - st.depth) * .25;
        const off = distSeg(p.x, p.y, ...VR.incision[0], ...VR.incision[1]);
        if (S.decomp === 'dried' && st.depth < .15) { st.last = p; st.skate = true; return; } // blade skates on leathery hide
        st.skate = false;
        if (off < 18) {
          for (const s of st.samples) if (!s.hit && Math.hypot(s.x - p.x, s.y - p.y) < 13) { s.hit = true; if (Math.random() < .3) SND.scrape(); }
          if (st.depth > D.skinWall && p.x > 340 && p.x < 640) {
            const lastG = st.gashes[st.gashes.length - 1];
            if (!lastG || Math.abs(lastG.x - p.x) > 40) {
              st.gashes.push({ x: p.x, y: p.y });
              if (st.gashes.length <= 3) addMistake('incision_deep'); else log('Deeper still into the belly wall.', 'bad');
              S.flags.breached = true; stink(4); SND.squelch();
            }
          }
        } else if (off < 70 && inEll(p, VR.body) && !st.stroke.ragged) {
          st.stroke.ragged = true; st.ragged++;
          if (S.saveHide) { S.hide.damage += 3; addMistake('incision_ragged'); } else log('The cut wandered off the midline.', 'warn');
        }
        st.last = p;
        if (st.samples.filter(s => s.hit).length >= 37) {
          st.samples.forEach(s => s.hit = true);
          st.phase = 'peel'; render(); log('Incision done. Hide parts along the belly.', 'ok');
          setHint('Press and hold on a body part to peel. Let go before the tension bar is full.');
        }
      },
      up() { st.last = null; st.hold = null; },
      draw(c, t, dt) {
        drawTray(c);
        drawVentral(c, t, { peel: st.peel });
        // incision guide and cut
        if (st.phase !== 'choose') {
          c.save(); c.setLineDash([6, 6]); c.strokeStyle = 'rgba(30,30,30,.55)'; c.lineWidth = 1.5;
          c.beginPath(); c.moveTo(...VR.incision[0]); c.lineTo(...VR.incision[1]); c.stroke(); c.setLineDash([]);
          c.strokeStyle = '#5b1612'; c.lineWidth = 3; c.lineCap = 'round';
          for (let i = 0; i < st.samples.length - 1; i++) {
            const a = st.samples[i], b = st.samples[i + 1];
            if (a.hit && b.hit) { c.beginPath(); c.moveTo(a.x, a.y + Math.sin(i) * .8); c.lineTo(b.x, b.y + Math.sin(i + 1) * .8); c.stroke(); }
          }
          for (const g of st.gashes) { c.fillStyle = '#c9b38a'; c.beginPath(); c.ellipse(g.x, g.y, 14, 6, 0, 0, 7); c.fill(); c.strokeStyle = '#5b1612'; c.stroke(); }
          c.restore();
        }
        // peeling: progress and tension
        if (st.phase === 'peel' && st.hold && !st.asking) {
          const r = st.hold, legK = r.leg ? r.id : null;
          let rate = .2 * D.peelRate, trate = .45 * D.peelTension;
          if (S.saveHide) { rate *= .8; if (r.id === 'head') trate *= 1.5; }
          if (r.id === 'tail') { if (st.stripTail) { rate *= 1.8; trate *= 2.2; } else { rate *= .6; trate *= .6; } }
          if (legK && S.flags.feet[legK] === 'skinout') { rate *= .5; trate *= 1.3; }
          st.holdT += dt;
          st.peel[r.id] = Math.min(1, st.peel[r.id] + rate * dt);
          st.tension += trate * dt * (1 + st.holdT * .6);
          if (Math.random() < dt * 3) SND.burst({ dur: .12, f0: 900, f1: 300, q: 3, vol: .08 });
          if (S.decomp === 'bloated') stink(dt * .6);
          if (st.tension >= 1) tear(r);
          if (legK && st.peel[legK] >= .6 && !S.flags.feet[legK]) { st.hold = null; footChoice(r); }
          if (st.peel[r.id] >= 1) { st.hold = null; log(`${r.label} skinned.`, 'ok'); }
        } else st.tension = Math.max(0, st.tension - .9 * dt);
        // hover label
        if (st.phase === 'peel' && pointer.inside) {
          const r = peelHit(pointer);
          if (r) { c.fillStyle = 'rgba(31,35,33,.85)'; c.font = '13px system-ui'; const s = `${r.label} · ${Math.round(st.peel[r.id] * 100)}%`; const w = c.measureText(s).width;
            c.fillRect(pointer.x + 14, pointer.y - 26, w + 12, 20); c.fillStyle = '#eee'; c.fillText(s, pointer.x + 20, pointer.y - 12); }
        }
        // side panel gauges (cheap DOM updates)
        if (st.phase === 'incise' && st.gaugeEl) {
          const dv = Math.min(1, st.depth / (D.skinWall * 1.4)), lbl = st.skate ? 'skating on leathery skin' : st.depth > D.skinWall ? 'into the belly wall' : st.depth > D.skinWall * .7 ? 'deep' : 'through the skin';
          st.gaugeEl.innerHTML = `Blade depth: <b>${lbl}</b><div class="bar"><i style="width:${dv * 100}%;background:${st.depth > D.skinWall ? '#8e2c25' : st.depth > D.skinWall * .7 ? '#b0812e' : '#6f8f7c'}"></i></div>`;
          st.progEl.innerHTML = `<span>Incision</span><b>${Math.round(st.samples.filter(s => s.hit).length / st.samples.length * 100)}%</b>`;
        }
        if (st.phase === 'peel' && st.gaugeEl) {
          st.gaugeEl.innerHTML = `Tension<div class="bar"><i style="width:${Math.min(100, st.tension * 100)}%;background:${st.tension > .75 ? '#8e2c25' : st.tension > .5 ? '#b0812e' : '#6f8f7c'}"></i></div>`;
          if (!st._lt || t - st._lt > 250) {
            st._lt = t;
            st.listEl.innerHTML = '';
            for (const r of PEEL_REGIONS) st.listEl.append(el('div', { class: 'stat' }, el('span', {}, r.label), el('b', {}, st.peel[r.id] >= 1 ? '✓' : Math.round(st.peel[r.id] * 100) + '%')));
            if (S.saveHide) st.listEl.append(el('div', { class: 'stat' }, el('span', {}, 'Hide condition'), el('b', {}, Math.max(0, 100 - S.hide.damage) + '%')));
          }
        }
      },
      cursor(c) { if (st.phase === 'incise') drawBlade(c, pointer); },
    };
    setHint('Decide whether to keep the hide.');
  },
};

/* ======================== STAGE 3: EVISCERATION ====================== */
/* Organs sit in the opened cavity. Each has attachments that must be cut
   before it lifts free. Gut organs puncture if the blade crosses them;
   gut ends must be tied before they're cut. */
function buildOrgans() {
  const D = DECOMP[S.decomp], gs = D.gutSize;
  const rows = [255, 279, 303, 327], pts = [[468, 246]];
  rows.forEach((y, i) => { for (let k = 0; k <= 10; k++) { const u = i % 2 ? 1 - k / 10 : k / 10; pts.push([472 + 128 * u, y + Math.sin(k * 1.3 + i) * 3]); } });
  pts.push([632, 322], [650, 304]);
  return {
    organs: [
      { id: 'kidneyL', name: 'Left kidney', shape: 'ell', g: [552, 214, 20, 11], color: '#5f2220', attach: ['renalL'] },
      { id: 'kidneyR', name: 'Right kidney', shape: 'ell', g: [552, 366, 20, 11], color: '#5f2220', attach: ['renalR'] },
      { id: 'pluck', name: 'Heart, lungs and throat', shape: 'ell', g: [292, 290, 52, 44], color: '#b8686c', attach: ['diaph1', 'diaph2', 'diaph3', 'trachea'], hyoid: true },
      { id: 'liver', name: 'Liver', shape: 'lobes', g: [[372, 256, 28, 22], [394, 292, 32, 30], [372, 328, 26, 21]], color: '#561c1a', attach: ['falciform'] },
      { id: 'intestine', name: 'Intestines', shape: 'tube', gut: true, pts, w: 14 * gs, color: S.decomp === 'bloated' ? '#b9a785' : '#d1a69b', attach: ['mes1', 'mes2', 'mes3', 'rectum'] },
      { id: 'stomach', name: 'Stomach', shape: 'ell', gut: true, g: [432, 232, 40 * Math.sqrt(gs), 26 * Math.sqrt(gs)], color: S.decomp === 'bloated' ? '#b3a27e' : '#caa094', attach: ['esoph', 'gastric'] },
      { id: 'bladder', name: 'Bladder', shape: 'ell', gut: 'bladder', g: [624, 262, 17 * Math.sqrt(gs), 12 * Math.sqrt(gs)], color: '#d6c584', attach: ['bladderNeck'] },
    ],
    attach: {
      renalL: { x: 576, y: 216, label: 'renal vessels' }, renalR: { x: 576, y: 364, label: 'renal vessels' },
      diaph1: { x: 340, y: 246, label: 'diaphragm' }, diaph2: { x: 336, y: 290, label: 'diaphragm' }, diaph3: { x: 340, y: 334, label: 'diaphragm' },
      trachea: { x: 236, y: 290, label: 'trachea and oesophagus at the throat' },
      falciform: { x: 352, y: 232, label: 'liver ligament' },
      mes1: { x: 530, y: 267, label: 'mesentery' }, mes2: { x: 556, y: 291, label: 'mesentery' }, mes3: { x: 508, y: 315, label: 'mesentery' },
      rectum: { x: 660, y: 300, label: 'colon at the vent', gutEnd: true },
      esoph: { x: 386, y: 222, label: 'oesophagus', gutEnd: true },
      gastric: { x: 452, y: 202, label: 'stomach ligament' },
      bladderNeck: { x: 646, y: 270, label: 'bladder neck', gutEnd: 'bladder' },
    },
  };
}

const stageEvisc = {
  key: 'evisc', title: 'Evisceration', short: 'Gut',
  mount(P) {
    const D = DECOMP[S.decomp];
    stageHead(P, 2, 'Cut each organ\'s attachments, then lift it out to the bucket. Don\'t open the gut.');
    const { organs, attach } = buildOrgans();
    for (const k in attach) Object.assign(attach[k], { cut: false, tied: false });
    const st = { tool: 'scalpel', last: null, grab: null, pools: [], hyoidFree: false };
    const wob = () => D.gutWobble + (S.flags.breached ? 2 : 0);
    const bucket = [800, 470, 58];
    const freed = o => o.attach.every(a => attach[a].cut);
    // intestine points with live wobble and drag offset
    const tubePts = (o, t) => o.pts.map(([x, y]) => [x + (o.dx || 0), y + (o.dy || 0) + (o.removed ? 0 : wob() * Math.sin(t / 650 + x / 37))]);
    const hitOrgan = (o, p, t, pad = 0) => {
      const dx = o.dx || 0, dy = o.dy || 0;
      if (o.shape === 'ell') { const [x, y, rx, ry] = o.g; return inEll(p, [x + dx, y + dy, rx + pad, ry + pad]); }
      if (o.shape === 'lobes') return o.g.some(([x, y, rx, ry]) => inEll(p, [x + dx, y + dy, rx + pad, ry + pad]));
      const q = tubePts(o, t);
      for (let i = 0; i < q.length - 1; i++) if (distSeg(p.x, p.y, ...q[i], ...q[i + 1]) < o.w / 2 + pad) return true;
      return false;
    };

    const puncture = (o, p) => {
      if (o.punctured) return;
      o.punctured = true;
      st.pools.push({ x: p.x, y: p.y, r: 8, color: o.gut === 'bladder' ? 'rgba(200,180,60,.55)' : 'rgba(95,90,35,.7)' });
      if (o.gut === 'bladder') { addMistake('bladder_puncture'); stink(6); expose(6, ['hands']); }
      else {
        addMistake('gut_puncture', o.name.toLowerCase());
        stink(S.decomp === 'bloated' ? 40 : S.decomp === 'dried' ? 8 : 22);
        expose(S.decomp === 'bloated' ? 16 : 8, S.decomp === 'bloated' ? ['hands', 'eyes', 'air'] : ['hands']);
        S.spec.stain += .04;
        if (S.decomp === 'bloated') { SND.hiss(); log('Gas and green fluid spray out of the gut.', 'bad'); }
      }
      SND.squelch();
    };
    const cutAt = (a, key, p) => {
      a.cut = true; SND.scrape();
      if (a.gutEnd && !a.tied) {
        if (a.gutEnd === 'bladder') { addMistake('bladder_puncture', 'cut untied'); stink(5); }
        else { addMistake('untied_gut', a.label); stink(12); expose(5); S.spec.stain += .02; }
        st.pools.push({ x: a.x, y: a.y, r: 6, color: 'rgba(95,90,35,.7)' });
        SND.squelch();
      }
    };
    // a blade stroke from a to b: cuts attachments it passes, punctures gut it crosses
    const stroke = (a, b, t) => {
      const L = Math.max(1, Math.hypot(b.x - a.x, b.y - a.y)), n = Math.ceil(L / 3);
      for (const [k, at] of Object.entries(attach)) if (!at.cut && distSeg(at.x, at.y, a.x, a.y, b.x, b.y) < 8) cutAt(at, k, b);
      for (const o of organs) {
        if (o.removed || !o.gut || o.punctured) continue;
        for (let i = 0; i <= n; i++) {
          const p = { x: a.x + (b.x - a.x) * i / n, y: a.y + (b.y - a.y) * i / n };
          if (hitOrgan(o, p, t, -2)) { puncture(o, p); break; }
        }
      }
    };

    const tools = el('div', { class: 'row' });
    const renderTools = () => {
      tools.innerHTML = '';
      for (const [k, label, tip] of [['scalpel', '1 Scalpel', 'Drag or click on an attachment (white dot) to cut it. Anything gut-coloured under the blade gets opened.'], ['tie', '2 Ligature', 'Click a gut end (oesophagus, colon, bladder neck) to tie it off before cutting.'], ['hand', '3 Hand', 'Drag a freed organ to the bucket. Pulling an organ that\'s still attached tears it.']]) {
        tools.append(el('button', { class: 'btn' + (st.tool === k ? ' on' : ''), 'data-tip': tip, onclick: () => { st.tool = k; renderTools(); } }, label));
      }
    };
    renderTools();
    P.append(el('h3', {}, 'Tools'), tools,
      el('p', {}, 'Tie both ends of the gut, cut the mesentery between the loops, then lift. The pluck (heart, lungs, windpipe, tongue) comes out through the diaphragm.',
        why('The gut is full of bacteria and, in a raccoon, possibly roundworm eggs. Kept closed, it comes out as one sealed bag. Opened, it soaks the cavity and later stains the bone.')));
    const statusEl = el('div'); P.append(statusEl);
    const keyH = e => { if (!statusEl.isConnected) return removeEventListener('keydown', keyH); const m = { 1: 'scalpel', 2: 'tie', 3: 'hand' }[e.key]; if (m) { st.tool = m; renderTools(); } };
    addEventListener('keydown', keyH);

    nextButton(P, 'Cavity is empty →', () => organs.every(o => o.removed), () => { advance(1, D.stench + 10); goStage(3); });

    scene = {
      smell: [470, 290],
      down(p) {
        const t = performance.now();
        if (st.tool === 'scalpel') { st.last = p; stroke(p, p, t); }
        if (st.tool === 'tie') {
          for (const at of Object.values(attach)) if (at.gutEnd && !at.cut && !at.tied && Math.hypot(at.x - p.x, at.y - p.y) < 14) { at.tied = true; log(`Tied off the ${at.label}.`, 'ok'); }
        }
        if (st.tool === 'hand') {
          const pl = organs.find(o => o.id === 'pluck');
          if (!pl.removed && !st.hyoidFree && Math.hypot(p.x - (262 + (pl.dx || 0)), p.y - (274 + (pl.dy || 0))) < 11) {
            st.hyoidFree = true; S.tray.push({ kind: 'hyoid' }); log('Freed the hyoid from the base of the tongue and set it on the tray.', 'ok'); return;
          }
          for (let i = organs.length - 1; i >= 0; i--) {
            const o = organs[i];
            if (!o.removed && hitOrgan(o, p, t, 3)) { st.grab = { o, sx: p.x, sy: p.y, ox: o.dx || 0, oy: o.dy || 0, torn: false }; break; }
          }
        }
      },
      move(p) {
        if (!pointer.down) return;
        if (st.tool === 'scalpel' && st.last) { stroke(st.last, p, performance.now()); st.last = p; }
        if (st.grab) {
          const g = st.grab, o = g.o, d = Math.hypot(p.x - g.sx, p.y - g.sy);
          if (!freed(o)) {
            if (d > 28 && !g.torn) {
              g.torn = true; addMistake('organ_torn', o.name.toLowerCase()); expose(3);
              if (o.gut) puncture(o, p);
              for (const a of o.attach) { const at = attach[a]; if (!at.cut) cutAt(at, a, p); }
              SND.tear();
            }
            if (!g.torn) { o.dx = g.ox + (p.x - g.sx) * .15; o.dy = g.oy + (p.y - g.sy) * .15; return; }
          }
          o.dx = g.ox + p.x - g.sx; o.dy = g.oy + p.y - g.sy;
        }
      },
      up(p) {
        st.last = null;
        if (!st.grab) return;
        const o = st.grab.o; st.grab = null;
        if (freed(o) && Math.hypot(p.x - bucket[0], p.y - bucket[1]) < bucket[2] + 10) {
          o.removed = true; SND.squelch(); log(`${o.name} out.`, 'ok');
          if (o.hyoid && !st.hyoidFree) { st.hyoidFree = true; loseBones('hyoid', 1, 'hyoid_lost'); }
        } else { o.dx = 0; o.dy = 0; }
      },
      draw(c, t) {
        drawTray(c);
        drawVentral(c, t, { skinned: true });
        // opened cavity
        c.save();
        const cav = ellPath(470, 290, 200, 100); cav.addPath(ellPath(292, 290, 64, 56));
        c.fillStyle = '#331310'; c.fill(cav);
        c.strokeStyle = '#6d2722'; c.lineWidth = 4; c.stroke(cav);
        c.clip(cav);
        for (const pool of st.pools) { pool.r = Math.min(pool.r + .05, 60); c.fillStyle = pool.color; c.beginPath(); c.ellipse(pool.x, pool.y, pool.r * 1.4, pool.r, 0, 0, 7); c.fill(); }
        // diaphragm
        c.strokeStyle = attach.diaph2.cut ? 'rgba(220,200,190,.25)' : 'rgba(225,205,195,.7)'; c.lineWidth = 5;
        c.beginPath(); c.moveTo(344, 196); c.quadraticCurveTo(326, 290, 344, 384); c.stroke();
        c.restore();
        // organs (dragged one drawn last)
        const order = organs.filter(o => !o.removed).sort((a, b) => (st.grab?.o === a) - (st.grab?.o === b));
        for (const o of order) drawOrgan(c, o, t);
        // hyoid glyph on the pluck
        const pl = organs.find(o => o.id === 'pluck');
        if (!pl.removed && !st.hyoidFree) {
          c.save(); c.translate(262 + (pl.dx || 0), 274 + (pl.dy || 0)); c.strokeStyle = '#efe6cf'; c.lineWidth = 3; c.lineCap = 'round';
          c.beginPath(); c.moveTo(-8, -6); c.quadraticCurveTo(0, 6, 8, -6); c.stroke(); c.restore();
        }
        // ribs over the thorax
        c.save(); c.strokeStyle = 'rgba(232,220,200,.55)'; c.lineWidth = 4;
        for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(300, 290, 40 + i * 4, -1.9 - i * .05, -1.2); c.stroke(); c.beginPath(); c.arc(300, 290, 40 + i * 4, 1.2, 1.9 + i * .05); c.stroke(); }
        c.restore();
        // attachments
        for (const [k, at] of Object.entries(attach)) {
          const owner = organs.find(o => o.attach.includes(k));
          if (owner.removed) continue;
          c.save(); c.translate(at.x, at.y);
          if (at.cut) { c.strokeStyle = 'rgba(240,230,220,.6)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-5, -3); c.lineTo(-1, 0); c.moveTo(5, 3); c.lineTo(1, 0); c.stroke(); }
          else {
            c.fillStyle = at.gutEnd ? '#f1e3c6' : '#eae4dc'; c.strokeStyle = '#3a1512'; c.lineWidth = 1.5;
            c.beginPath(); c.arc(0, 0, 4.5, 0, 7); c.fill(); c.stroke();
            if (at.gutEnd) { c.strokeStyle = at.tied ? '#2a2724' : 'rgba(241,227,198,.6)'; c.lineWidth = at.tied ? 3 : 1; c.setLineDash(at.tied ? [] : [2, 2]); c.beginPath(); c.arc(0, 0, 9, 0, 7); c.stroke(); }
          }
          c.restore();
        }
        // bucket
        c.save(); c.fillStyle = '#6b7275'; c.strokeStyle = '#3f4447'; c.lineWidth = 3;
        c.beginPath(); c.ellipse(bucket[0], bucket[1], bucket[2], bucket[2] * .55, 0, 0, 7); c.fill(); c.stroke();
        c.fillStyle = '#2d1513'; c.beginPath(); c.ellipse(bucket[0], bucket[1], bucket[2] - 8, (bucket[2] - 8) * .5, 0, 0, 7); c.fill();
        c.fillStyle = '#e9e6dc'; c.font = '12px system-ui'; c.textAlign = 'center'; c.fillText('offal bucket', bucket[0], bucket[1] + bucket[2] * .55 + 16);
        c.restore();
        // hover hint
        if (pointer.inside && !pointer.down) {
          let label = null;
          for (const [k, at] of Object.entries(attach)) if (!at.cut && Math.hypot(at.x - pointer.x, at.y - pointer.y) < 9 && !organs.find(o => o.attach.includes(k)).removed) label = at.label + (at.gutEnd ? (at.tied ? ' · tied' : ' · untied') : '');
          if (!label) for (const o of [...organs].reverse()) if (!o.removed && hitOrgan(o, pointer, t)) { label = o.name + (freed(o) ? ' · free' : ` · ${o.attach.filter(a => !attach[a].cut).length} attached`); break; }
          if (!label && !st.hyoidFree && Math.hypot(pointer.x - 262, pointer.y - 274) < 11) label = 'Hyoid (grab with hand to free it)';
          if (label) { c.font = '13px system-ui'; const w = c.measureText(label).width; c.fillStyle = 'rgba(31,35,33,.85)'; c.fillRect(pointer.x + 14, pointer.y - 26, w + 12, 20); c.fillStyle = '#eee'; c.fillText(label, pointer.x + 20, pointer.y - 12); }
        }
        if (!st._lt || t - st._lt > 300) {
          st._lt = t; statusEl.innerHTML = '';
          for (const o of organs) statusEl.append(el('div', { class: 'stat' }, el('span', {}, o.name), el('b', {}, o.removed ? '✓ out' : freed(o) ? 'free' : `${o.attach.filter(a => !attach[a].cut).length} attached` + (o.punctured ? ' · torn' : ''))));
        }
      },
      cursor(c) {
        if (st.tool === 'scalpel') drawBlade(c, pointer);
        if (st.tool === 'tie' && pointer.inside) { c.strokeStyle = '#2a2724'; c.lineWidth = 2; c.beginPath(); c.arc(pointer.x, pointer.y, 9, 0, 7); c.stroke(); }
        if (st.tool === 'hand' && pointer.inside && !st.grab) { c.fillStyle = 'rgba(210,225,230,.5)'; c.beginPath(); c.arc(pointer.x, pointer.y, 10, 0, 7); c.fill(); }
      },
    };
    setHint('Tie the gut ends (2), cut the white attachments (1), then drag organs to the bucket (3).');
    function drawOrgan(c, o, t) {
      c.save();
      const dx = o.dx || 0, dy = o.dy || 0;
      c.fillStyle = o.color; c.strokeStyle = 'rgba(30,10,8,.6)'; c.lineWidth = 1.5;
      if (o.shape === 'ell') { const [x, y, rx, ry] = o.g; c.beginPath(); c.ellipse(x + dx, y + dy, rx, ry, 0, 0, 7); c.fill(); c.stroke(); }
      if (o.shape === 'lobes') for (const [x, y, rx, ry] of o.g) { c.beginPath(); c.ellipse(x + dx, y + dy, rx, ry, 0, 0, 7); c.fill(); c.stroke(); }
      if (o.shape === 'tube') {
        const q = tubePts(o, t);
        c.lineJoin = c.lineCap = 'round';
        c.strokeStyle = 'rgba(40,15,10,.6)'; c.lineWidth = o.w + 3; c.beginPath(); q.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke();
        c.strokeStyle = o.color; c.lineWidth = o.w; c.stroke();
        c.strokeStyle = 'rgba(255,240,230,.3)'; c.lineWidth = o.w * .25; c.stroke();
      }
      // gloss highlight
      if (o.shape !== 'tube') { const [x, y] = o.shape === 'ell' ? o.g : o.g[1]; c.fillStyle = 'rgba(255,240,235,.18)'; c.beginPath(); c.ellipse(x + dx - 6, y + dy - 6, 8, 4, -.5, 0, 7); c.fill(); }
      if (o.punctured) { c.fillStyle = 'rgba(70,65,25,.8)'; const [x, y] = o.shape === 'tube' ? tubePts(o, t)[20] : o.shape === 'ell' ? o.g : o.g[1]; c.beginPath(); c.arc(x + (o.shape === 'tube' ? 0 : dx), y + (o.shape === 'tube' ? 0 : dy), 5, 0, 7); c.fill(); }
      c.restore();
    }
  },
};

/* ====================== STAGE 4: GROSS DEFLESHING ==================== */
/* A tissue grid laid over a lateral skeleton. Strokes thin the tissue. Where
   the tissue is already gone and bone is underneath, the blade nicks bone. */
const G = 6, GW = Math.ceil(W / G), GH = Math.ceil(H / G);
const TOOLS4 = {
  knife: { label: 'Boning knife', r: 20, amt: .035, nick: .05, tip: 'Takes muscle off fast. Wide and heavy, so it slips into bone easily.' },
  scalpel: { label: 'Scalpel', r: 10, amt: .014, nick: .01, tip: 'Slow and precise. Use it near bone and in tight spots.' },
  spoon: { label: 'Eye spoon', r: 0, tip: 'Hold it on the orbit to scoop the eye out without touching bone.' },
  hose: { label: 'Hose & syringe', r: 0, tip: 'Hold it at the foramen magnum (back of the skull) to flush the brain out with water.' },
  wire: { label: 'Bent wire', r: 0, tip: 'Hold and wiggle at the foramen magnum to break up brain tissue. Faster. Too vigorous and you break the delicate bones behind the nose.' },
};
const stageDeflesh = {
  key: 'deflesh', title: 'Gross defleshing', short: 'Deflesh',
  mount(P) {
    const D = DECOMP[S.decomp], A = S.animal;
    stageHead(P, 3, 'Strip the bulk muscle off the skeleton. Leave a thin film; maceration finishes the job. Then take the eyes and brain.');
    // build grid: bone group per cell, starting tissue per cell
    const parts = A.art.skeleton(), muscle = A.art.muscle();
    const groups = [...new Set(parts.map(p => p.group))];
    const off = document.createElement('canvas'); off.width = W; off.height = H; const oc = off.getContext('2d');
    const bone = new Int16Array(GW * GH).fill(-1), tis = new Float32Array(GW * GH), t0 = new Float32Array(GW * GH), nicked = new Uint8Array(GW * GH);
    for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
      const x = i * G + G / 2, y = j * G + G / 2, k = j * GW + i;
      for (const [path, th] of muscle) if (oc.isPointInPath(path, x, y)) tis[k] = Math.max(tis[k], th * (.85 + Math.random() * .3));
      for (const p of parts) if (oc.isPointInPath(p.path, x, y)) { bone[k] = groups.indexOf(p.group); break; }
      if (bone[k] >= 0 && !tis[k]) tis[k] = .15;
      t0[k] = tis[k];
    }
    const total0 = t0.reduce((a, b) => a + b, 0);
    const img = document.createElement('canvas'); img.width = GW; img.height = GH; const ic = img.getContext('2d'); const id = ic.createImageData(GW, GH);
    const st = { tool: 'knife', last: null, eyes: 0, brain: 0, nicks: [], coolDist: 0, splashT: 0, wireT: 0, remaining: 1, goo: [] };
    const [ox, oy] = A.art.orbit, [fx, fy] = A.art.foramen;

    const tools = el('div', { class: 'row' });
    const renderTools = () => {
      tools.innerHTML = '';
      Object.entries(TOOLS4).forEach(([k, T], i) => tools.append(el('button', { class: 'btn' + (st.tool === k ? ' on' : ''), 'data-tip': T.tip, onclick: () => { st.tool = k; renderTools(); } }, `${i + 1} ${T.label}`)));
    };
    renderTools();
    P.append(el('h3', {}, 'Tools'), tools,
      el('p', {}, 'Deep red is bulk muscle. Pink film is thin enough. Where you see clean bone, stop: the blade will nick it.',
        why('Nicks and gouges are permanent and show on the finished bone. Bacteria and beetles remove the last film without touching the bone, so there is no reason to scrape down to it.')));
    const statEl = el('div'); P.append(statEl);
    const keyH = e => { if (!statEl.isConnected) return removeEventListener('keydown', keyH); const k = Object.keys(TOOLS4)[+e.key - 1]; if (k) { st.tool = k; renderTools(); } };
    addEventListener('keydown', keyH);

    nextButton(P, 'Bulk is off →', () => st.remaining <= .5, async () => {
      if (st.eyes < 1 || st.brain < 1) {
        const go = await ask('Not finished in the head', `${st.eyes < 1 ? 'The eyes are still in. ' : ''}${st.brain < 1 ? 'The brain is still in the braincase.' : ''}`, [
          { value: false, label: 'Go back and finish', primary: true }, { value: true, label: 'Leave it for maceration' }]);
        if (!go) return;
        if (st.eyes < 1) addMistake('eyes_left');
        if (st.brain < 1) { addMistake('brain_left'); S.spec.brainLeft = true; S.spec.grease += .15; }
      }
      if (st.remaining > .35) log('A lot of tissue left on. Maceration will take longer and smell worse.', 'warn');
      S.flags.tissueLeft = st.remaining;
      // small bones that came out loose in the scraps go to the tray for stage 5
      for (let i = 0; i < S.bones.sesamoids.n; i++) S.tray.push({ kind: 'sesamoid' });
      for (let i = 0; i < 2; i++) S.tray.push({ kind: 'patella' });
      if (S.bones.baculum) S.tray.push({ kind: 'baculum' });
      for (let i = 0; i < Math.max(0, 4 - S.bones.caudal.lost); i++) S.tray.push({ kind: 'caudal' });
      for (const [leg, v] of Object.entries(S.flags.feet || {})) if (v === 'skinout') S.tray.push({ kind: leg.startsWith('fore') ? 'claw_f' : 'claw_h' });
      advance(3, D.stench + 15 * st.remaining);
      goStage(4);
    });

    const scrape = (a, b) => {
      const T = TOOLS4[st.tool], L = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(1, Math.ceil(L / 3));
      const speed = L / Math.max(1, b.t - a.t);
      for (let s = 0; s <= n; s++) {
        const x = a.x + (b.x - a.x) * s / n, y = a.y + (b.y - a.y) * s / n;
        // knife on the eye: gouges the orbit rim
        if (st.eyes < 1 && Math.hypot(x - ox, y - oy) < 14) { st.eyes = 1; addMistake('orbit_nick'); SND.nick(); }
        const ri = Math.ceil(T.r / G), ci = Math.floor(x / G), cj = Math.floor(y / G);
        for (let j = cj - ri; j <= cj + ri; j++) for (let i = ci - ri; i <= ci + ri; i++) {
          if (i < 0 || j < 0 || i >= GW || j >= GH) continue;
          const k = j * GW + i, d = Math.hypot(i * G + G / 2 - x, j * G + G / 2 - y);
          if (d > T.r || !t0[k]) continue;
          const before = tis[k];
          tis[k] = Math.max(0, tis[k] - T.amt * D.deflesh * (1 - d / T.r) * (L / n) / 3);
          // nick: blade core over bone that is already bare
          if (bone[k] >= 0 && before < .04 && d < T.r * .6 && !nicked[k] && st.coolDist <= 0) {
            if (Math.random() < T.nick * D.nickMul * Math.min(2, Math.max(.5, speed))) {
              nicked[k] = 1; st.coolDist = 30;
              st.nicks.push({ x: i * G + G / 2, y: j * G + G / 2, a: Math.random() * 3 });
              S.spec.nicks++; addMistake('bone_nick', groups[bone[k]]); SND.nick();
            }
          }
        }
      }
      st.coolDist -= L;
      if (Math.random() < .25) SND.scrape();
      if (Math.random() < .08) SND.burst({ dur: .15, f0: 700, f1: 200, q: 4, vol: .1 });
    };

    scene = {
      smell: [440, 300],
      down(p) { st.last = p; },
      move(p) {
        if (!pointer.down || !st.last) return;
        if (st.tool === 'knife' || st.tool === 'scalpel') scrape(st.last, p);
        if (st.tool === 'wire' && Math.hypot(p.x - fx, p.y - fy) < 22 && st.brain < 1) {
          const d = Math.hypot(p.x - st.last.x, p.y - st.last.y);
          st.brain = Math.min(1, st.brain + d * .0035 * (S.decomp === 'dried' ? .5 : 1));
          st.wireT += d;
          if (st.wireT > 60) { st.wireT = 0; if (!hasMistake('ethmoid_break') && Math.random() < .07) { addMistake('ethmoid_break'); SND.nick(); } }
          if (Math.random() < .1) st.goo.push({ x: fx + 4, y: fy + 4, vy: 0 });
        }
        st.last = p;
      },
      up() { st.last = null; },
      draw(c, t, dt) {
        drawTray(c);
        // skeleton
        c.save();
        for (const p of parts) { c.fillStyle = '#e4d9c0'; c.fill(p.path); c.strokeStyle = '#a3967a'; c.lineWidth = 1; c.stroke(p.path); }
        c.fillStyle = '#2b2522'; c.beginPath(); c.arc(ox, oy, 13, 0, 7); c.fill();
        if (st.eyes < 1) { c.fillStyle = '#1d1d22'; c.beginPath(); c.arc(ox, oy, 11 * (1 - st.eyes * .8), 0, 7); c.fill(); c.fillStyle = 'rgba(200,210,230,.5)'; c.beginPath(); c.arc(ox - 3, oy - 3, 3 * (1 - st.eyes), 0, 7); c.fill(); }
        c.fillStyle = '#2b2522'; c.beginPath(); c.ellipse(fx, fy, 7, 9, .4, 0, 7); c.fill();
        c.restore();
        // tissue
        const d = id.data;
        let sum = 0;
        for (let k = 0; k < tis.length; k++) {
          const v = tis[k]; sum += v;
          const o = k * 4;
          if (v <= .003) { d[o + 3] = 0; continue; }
          const u = Math.min(1, v / .45);
          d[o] = 205 - 85 * u; d[o + 1] = 140 - 105 * u; d[o + 2] = 128 - 95 * u;
          if (S.decomp === 'dried') { d[o] *= .75; d[o + 1] *= .7; d[o + 2] *= .6; }
          if (S.decomp === 'bloated') { d[o + 1] += 12; }
          d[o + 3] = (.3 + .67 * u) * 255;
        }
        st.remaining = sum / total0;
        ic.putImageData(id, 0, 0);
        c.save(); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; c.filter = `blur(${2.5 * view.s}px)`; c.drawImage(img, 0, 0, GW * G, GH * G); c.filter = 'none';
        c.restore();
        // nicks
        c.save(); c.strokeStyle = '#3a2a22'; c.lineWidth = 2;
        for (const n of st.nicks) { c.beginPath(); c.moveTo(n.x - 4 * Math.cos(n.a), n.y - 4 * Math.sin(n.a)); c.lineTo(n.x + 4 * Math.cos(n.a), n.y + 4 * Math.sin(n.a)); c.stroke(); }
        c.restore();
        // eye spoon and brain flushing are hold actions
        const at = (x, y, r) => pointer.down && Math.hypot(pointer.x - x, pointer.y - y) < r;
        if (st.tool === 'spoon' && at(ox, oy, 16) && st.eyes < 1) {
          st.eyes = Math.min(1, st.eyes + dt / 1.6); if (Math.random() < dt * 4) SND.squelch();
          if (st.eyes >= 1) log('Eyes out (both sides).', 'ok');
        }
        if (st.tool === 'hose' && at(fx, fy, 20) && st.brain < 1) {
          st.brain = Math.min(1, st.brain + dt * .2 * (S.decomp === 'dried' ? .4 : 1));
          st.splashT += dt;
          if (st.splashT > .6) { st.splashT = 0; expose(1.2, ['hands', 'eyes', 'air']); SND.slosh(); }
          if (Math.random() < dt * 8) st.goo.push({ x: fx + 4, y: fy + 4, vy: 0 });
          if (st.brain >= 1) log('Brain flushed out through the foramen magnum.', 'ok');
        }
        // goo dribbling from the foramen
        c.fillStyle = 'rgba(205,170,165,.85)';
        for (const g of st.goo) { g.vy += dt * 200; g.y += g.vy * dt; g.x += dt * 10; c.beginPath(); c.arc(g.x, g.y, 3, 0, 7); c.fill(); }
        st.goo = st.goo.filter(g => g.y < 520);
        // stats
        if (!st._lt || t - st._lt > 250) {
          st._lt = t; statEl.innerHTML = '';
          const row = (a, b, cls) => statEl.append(el('div', { class: 'stat' }, el('span', { class: cls || '' }, a), el('b', {}, b)));
          row('Bulk tissue remaining', Math.round(st.remaining * 100) + '%' + (st.remaining <= .35 ? ' ✓' : st.remaining <= .5 ? ' ok' : ''));
          row('Bone nicks', String(S.spec.nicks));
          row('Eyes', st.eyes >= 1 ? '✓ out' : Math.round(st.eyes * 100) + '%');
          row('Brain', st.brain >= 1 ? '✓ flushed' : Math.round(st.brain * 100) + '%');
          statEl.append(el('div', { class: 'gauge' }, 'Target: under 35% remaining. You can move on at 50%.'));
        }
      },
      cursor(c) {
        const T = TOOLS4[st.tool];
        if (!pointer.inside && !pointer.down) return;
        if (T.r) { c.strokeStyle = 'rgba(30,30,30,.4)'; c.lineWidth = 1; c.beginPath(); c.arc(pointer.x, pointer.y, T.r, 0, 7); c.stroke(); drawBlade(c, pointer); }
        else { c.strokeStyle = '#2a2d2f'; c.lineWidth = 3; c.beginPath(); c.moveTo(pointer.x, pointer.y); c.lineTo(pointer.x + 30, pointer.y - 30); c.stroke(); c.fillStyle = '#9aa3a8'; c.beginPath(); c.arc(pointer.x, pointer.y, 4, 0, 7); c.fill(); }
      },
    };
    setHint('Knife (1) for bulk, scalpel (2) near bone. Spoon (3) on the eye, hose (4) or wire (5) at the hole in the back of the skull.');
  },
};

/* ==================== STAGE 5: INVENTORY & SMALL BONES =============== */
/* Loose items from earlier stages (S.tray) plus look-alike scraps. Drag each

const BONE_FILL = '#e6dcc4', BONE_LINE = '#9a8c70';
const TRAY_KINDS = {
  hyoid: { group: 'hyoid', bag: 'hyoid', desc: 'A small U of thin rods, about 3 cm across. Came out of the throat.', svg: `<path d="M8 10 Q20 34 32 10" fill="none" stroke="${BONE_LINE}" stroke-width="6" stroke-linecap="round"/><path d="M8 10 Q20 34 32 10" fill="none" stroke="${BONE_FILL}" stroke-width="4" stroke-linecap="round"/>` },
  sesamoid: { group: 'sesamoids', bag: 'sesamoids', desc: 'Pea-sized, smooth, hard. Doesn\'t give when pressed.', svg: `<ellipse cx="20" cy="20" rx="5" ry="6.5" fill="${BONE_FILL}" stroke="${BONE_LINE}"/>` },
  patella: { group: 'patella', bag: 'patella', desc: 'Teardrop-shaped and dense, one face smooth and glassy.', svg: `<path d="M20 8 C30 12 28 30 20 32 C12 30 10 12 20 8Z" fill="${BONE_FILL}" stroke="${BONE_LINE}"/>` },
  baculum: { group: 'baculum', bag: 'baculum', desc: 'A slender, slightly curved rod of bone, about 10 cm, hooked at one end.', svg: `<path d="M5 30 Q20 26 33 10 Q35 7 32 6" fill="none" stroke="${BONE_LINE}" stroke-width="5" stroke-linecap="round"/><path d="M5 30 Q20 26 33 10 Q35 7 32 6" fill="none" stroke="${BONE_FILL}" stroke-width="3" stroke-linecap="round"/>` },

  claw_f: { group: 'foreph', bag: 'feet', desc: 'A curved, pointed bone with a horn sheath on it. A claw core.', svg: `<path d="M10 28 Q14 10 32 8 Q22 14 18 30Z" fill="#d8ccb2" stroke="#4a4038"/>` },
  claw_h: { group: 'hindph', bag: 'feet', desc: 'A curved, pointed bone with a horn sheath on it. A claw core.', svg: `<path d="M10 28 Q14 10 32 8 Q22 14 18 30Z" fill="#d8ccb2" stroke="#4a4038"/>` },

  cartilage: { decoy: true, desc: 'A translucent blue-white disc that flexes.', svg: `<ellipse cx="20" cy="20" rx="10" ry="8" fill="rgba(210,225,235,.9)" stroke="#9fb3c2"/>` },

  lymph: { decoy: true, desc: 'Bean-shaped, soft, grey-pink.', svg: `<ellipse cx="20" cy="20" rx="9" ry="6" fill="#b99a98" stroke="#7b5d5b"/>` },
  tendon: { decoy: true, desc: 'Stringy silver fibres.', svg: `<path d="M6 14 Q20 22 34 14 M6 20 Q20 28 34 20 M6 26 Q20 32 34 26" fill="none" stroke="#d9dde0" stroke-width="2"/>` },
  pebble: { decoy: true, desc: 'Grey, hard and cold, gritty on the surface. From the roadside.', svg: `<path d="M10 24 L12 13 L24 10 L32 18 L28 28 L16 30Z" fill="#8d9090" stroke="#5c6060"/>` },
};
const BAGS = [
  { id: 'hyoid', label: 'Hyoid', x: 760, y: 60 }, { id: 'sesamoids', label: 'Sesamoids', x: 760, y: 170 },
  { id: 'patella', label: 'Patellae', x: 760, y: 280 }, { id: 'caudal', label: 'Tail tip', x: 760, y: 390 },
  { id: 'feet', label: 'Phalanges', x: 610, y: 420 }, { id: 'baculum', label: 'Baculum', x: 460, y: 420 },
  { id: 'discard', label: 'Waste bucket', x: 80, y: 420, discard: true },
];

function checklist(container) {
  container.innerHTML = '';
  const box = el('div', { class: 'check' });
  for (const b of Object.values(S.bones)) {
    const cls = b.lost ? 'lost' : b.small && !b.bagged ? 'risk' : '';
    box.append(el('div', { class: 'stat' }, el('span', { class: cls }, b.name), el('b', {}, `${b.have}/${b.n}${b.bagged ? ' · bagged' : ''}`)));
  }

const stageInventory = {
  key: 'inventory', title: 'Inventory & small bones', short: 'Count',
  mount(P) {
    stageHead(P, 4, 'The tray is a mess of scraps. Some of them are bones you can\'t replace. Bag and label the bones; bin the rest.');
    P.append(el('p', {}, 'Hover or tap an item to feel it. Click a bag\'s blank tag to label it.',
      why('Small elements are the first thing lost in amateur preps. The hyoid comes out with the throat, sesamoids hide behind joints, and the last tail vertebrae are tiny. A specimen missing them is incomplete forever.')));
    // decoys mixed in with whatever earlier stages produced
    const items = [...S.tray, ...['gristle', 'gristle', 'cartilage', 'fat', 'fat', 'lymph', 'tendon', 'pebble'].map(kind => ({ kind }))];
    const r = rng(42 + items.length);
    items.forEach((it, i) => { it.x = 110 + r() * 540; it.y = 80 + r() * 290; it.where = null; it.uid = i; });
    const bags = BAGS.map(b => ({ ...b, labeled: b.discard, items: [] }));

    const board = el('div', { style: `position:absolute;left:0;top:0;width:${W}px;height:${H}px;transform-origin:0 0` });
    $('#overlay').append(board);
    const fitBoard = () => { board.style.transform = `translate(${view.ox}px,${view.oy}px) scale(${view.s})`; };
    const bagEls = {};
    for (const b of bags) {
      const tag = el('span', { class: 'tagl' + (b.labeled ? '' : ' blank') }, b.labeled ? b.label : `✎ ${b.label}?`);
      if (!b.labeled) tag.addEventListener('click', () => { b.labeled = true; tag.className = 'tagl'; tag.textContent = b.label; tag.nextSibling.textContent = 'zip bag'; log(`Labeled the ${b.label.toLowerCase()} bag.`); });

    }
    const bagAt = (x, y) => bags.find(b => x >= b.x && x <= b.x + 112 && y >= b.y && y <= b.y + 92);
    for (const it of items) {
      const K = TRAY_KINDS[it.kind];
      const e = el('div', { class: 'item', style: `left:${it.x}px;top:${it.y}px`, 'data-tip': K.desc, html: `<svg viewBox="0 0 40 40">${K.svg}</svg>` });
      it.el = e; board.append(e);
      e.addEventListener('pointerdown', ev => {
        ev.preventDefault(); e.setPointerCapture(ev.pointerId); e.style.zIndex = 5;
        const move = mv => {
          const p = toLogical(mv); e.style.left = p.x + 'px'; e.style.top = p.y + 'px';
          for (const b of bags) bagEls[b.id].e.classList.toggle('hot', b === bagAt(p.x, p.y));
        };
        const up = upEv => {
          e.removeEventListener('pointermove', move); e.removeEventListener('pointerup', up);
          const p = toLogical(upEv), b = bagAt(p.x, p.y);
          for (const bb of bags) bagEls[bb.id].e.classList.remove('hot');
          if (b) { it.where = b.id; b.items.push(it); e.remove(); bagEls[b.id].cnt.textContent = `${b.items.length} item${b.items.length === 1 ? '' : 's'}`; SND.burst({ dur: .1, f0: 1800, f1: 1200, q: 2, type: 'bandpass', vol: .08 }); }
          else { it.x = p.x; it.y = p.y; }
        };
        e.addEventListener('pointermove', move); e.addEventListener('pointerup', up);
      });
    }
    const left = el('div', { class: 'stat' }); P.append(left);
    P.append(el('h3', {}, 'Skeleton checklist'));
    const chk = el('div'); P.append(chk); checklist(chk);

    nextButton(P, 'Tray is sorted →', () => true, async () => {
      const remainingBones = items.filter(it => !it.where && !TRAY_KINDS[it.kind].decoy).length;
      if (remainingBones || items.some(it => !it.where)) {
        const ok = await ask('Clear the tray?', 'Anything still on the tray gets swept into the waste with the scraps.', [{ value: false, label: 'Keep sorting', primary: true }, { value: true, label: 'Sweep it' }]);
        if (!ok) return;
      }
      // judge every item now
      for (const it of items) {
        const K = TRAY_KINDS[it.kind], b = bags.find(x => x.id === it.where);
        if (K.decoy) { if (b && !b.discard) addMistake('tissue_bagged', it.kind); continue; }
        if (!b) loseBones(K.group, 1, 'small_left');
        else if (b.discard) loseBones(K.group, 1, 'small_discarded');
        else if (b.id !== K.bag) addMistake('mislabeled', `${it.kind} in ${b.label.toLowerCase()}`);
        else S.bones[K.group].bagged = true;
      }
      if (bags.some(b => !b.labeled && b.items.some(it => !TRAY_KINDS[it.kind].decoy))) addMistake('unlabeled');
      S.tray = [];
      advance(1.5);
      goStage(5);
    });

    scene = {
      smell: [400, 250],
      draw(c, t) {
        drawTray(c);
        c.save(); c.fillStyle = 'rgba(120,50,42,.25)';
        for (let i = 0; i < 14; i++) { c.beginPath(); c.ellipse(140 + (i * 97) % 520, 100 + (i * 61) % 260, 30, 14, i, 0, 7); c.fill(); }

    };
    setHint('Drag each item into a bag or the waste bucket. Bags need a label.');
  },
};

/* METHODS: each has a unit (day or hour), a tick() that advances one unit and
   may set M.pending to an event, and draw() for the vessel. Shared helpers
   handle teeth and small bones that fall loose. */
let M = null;
const fToRate = (t, table) => { for (const [max, v] of table) if (t <= max) return v; return table[table.length - 1][1]; };

function dropTooth() {
  const cand = S.teeth.filter(t => t.state === 'seated' && t.canFall);
  if (!cand.length) return;
  const tooth = cand[Math.floor(Math.random() * cand.length)];
  tooth.state = 'loose'; M.looseTeeth++;
}
/* Foot bones from feet macerated whole come loose as tissue goes. */
function loosenFeet(frac) {
  for (const [leg, v] of Object.entries(S.flags.feet || {})) {
    if (v !== 'whole') continue;
    const ids = leg.startsWith('fore') ? ['carpals', 'metacarpals', 'foreph'] : ['tarsals', 'metatarsals', 'hindph'];
    for (const id of ids) {
      const target = Math.floor(S.bones[id].n / 2 * frac), key = leg + id;
      M.looseFeet[key] = Math.max(M.looseFeet[key] || 0, target);
    }
  }
}
/* What happens to everything loose when the water (or soil, or frass) is emptied. */
function emptyVessel(keep, causeTeeth = 'teeth_dumped', causeSmall = 'small_dumped') {
  const loose = S.teeth.filter(t => t.state === 'loose');
  if (keep) { loose.forEach(t => t.state = 'collected'); if (loose.length) log(`Sieve caught ${loose.length} loose teeth.`, 'ok'); }
  else if (loose.length) { loose.forEach(t => t.state = 'lost'); addMistake(causeTeeth, `${loose.length} teeth`); }
  M.looseTeeth = 0;
  for (const [key, k] of Object.entries(M.looseFeet)) {
    const id = key.replace(/^(fore|hind)[LR]/, ''), got = k - (M.feetSaved[key] || 0);
    if (got <= 0) continue;
    if (keep) M.feetSaved[key] = k; else { loseBones(id, got, causeSmall); M.feetSaved[key] = k; }
  }
}

/* Cold and warm water share most of their logic. */
function waterTick(base, temp) {
  const D = DECOMP[S.decomp];
  const warm = base > .03, tf = warm ? fToRate(temp, [[74, .5], [84, .8], [95, 1], [100, .85], [110, .4], [999, .15]]) : 1;
  const rehyd = S.decomp === 'dried' && M.days < 6 ? .35 : 1;
  M.bac = Math.min(1, M.bac + .1);
  M.tissue -= base * D.macMul * rehyd * M.bac * tf;
  M.foul += warm ? .13 : .09;
  if (M.foul > 1.15) { S.spec.stain += .006; if (S.spec.stain > .04 && !hasMistake('rancid')) addMistake('rancid'); }
  if (M.tissue < .6 && Math.random() < .3) dropTooth();
  loosenFeet(Math.max(0, 1 - M.tissue * 2));
  if (!M.pending && M.foul >= .75 && !M.foulAsked) {
    M.foulAsked = true;
    M.pending = { title: 'The water has turned', text: 'Opaque grey-brown, with a fatty scum and a smell you can taste.', choices: [
      { label: 'Change it through a sieve, keep a cup as starter', note: 'Fresh water, same bacteria.', value: () => changeWater(true, true) },
      { label: 'Change it through a sieve', note: 'Clean restart; the bacteria have to rebuild.', value: () => changeWater(true, false) },
      { label: 'Dump it straight and refill', value: () => changeWater(false, false) },
      { label: 'Leave it a while longer', note: 'Asks again in three days.', value: () => { M.snooze = 3; } }] };
  } else if (M.snooze > 0 && --M.snooze === 0) M.foulAsked = false;
  return null;
}
function changeWater(sieve, starter) {
  emptyVessel(sieve);
  M.foul = starter ? .2 : .05; M.bac = starter ? .9 : .4; M.foulAsked = false;
  SND.slosh(); expose(1.5, ['hands', 'eyes']); log(sieve ? 'Water changed through a sieve.' : 'Water dumped and refilled.', sieve ? 'ok' : 'warn');
}
async function waterFinish() {
  const sieve = await ask('Last pour', 'The bones are bare. One more pour to get them out.', [{ value: true, label: 'Pour through a sieve', primary: true }, { value: false, label: 'Dump it and fish the bones out' }]);
  emptyVessel(sieve);
}
function switchMethod(id) {
  log(`Switching to ${METHODS[id].label.toLowerCase()}.`, 'warn');
  M.method = id; METHODS[id].init(); M.switched = true;
  S.flags.macMethod = id;
  stageMacerate.renderRun?.();
}
/* A heap of bones with a tissue coat that thins as M.tissue drops. */
function drawSpecimenPile(c, x, y, tissue, tColor, stain = 0) {
  c.save();
  const bone = stain > .05 ? `rgb(${200 - stain * 300},${180 - stain * 330},${140 - stain * 340})` : '#e2d6bb';
  const bits = [[0, 0, 60, 14, .2], [-50, 10, 40, 8, -.4], [50, 14, 46, 9, .5], [-20, -18, 30, 26, 0], [30, -10, 34, 7, 1.2], [-70, -6, 26, 6, 1], [70, -4, 28, 6, -1.1]];
  for (const [dx, dy, rx, ry, a] of bits) { c.fillStyle = bone; c.strokeStyle = '#9a8c70'; c.beginPath(); c.ellipse(x + dx, y + dy, rx, ry, a, 0, 7); c.fill(); c.stroke(); }
  c.globalAlpha = Math.max(0, Math.min(.9, tissue * .9));
  c.fillStyle = tColor;
  for (const [dx, dy, rx, ry, a] of bits) { c.beginPath(); c.ellipse(x + dx, y + dy, rx * .9, ry * 1.1, a, 0, 7); c.fill(); }
  c.restore();
}
function drawBucket(c, t, heater) {
  c.save();
  c.fillStyle = '#d7dadb'; c.strokeStyle = '#8b9295'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(280, 130); c.lineTo(620, 130); c.lineTo(590, 480); c.lineTo(310, 480); c.closePath(); c.fill(); c.stroke();
  const lvl = heater ? 140 + (1 - (M.level ?? 1)) * 200 : 140;
  const f = Math.min(1.4, M.foul);
  c.save(); c.beginPath(); c.moveTo(282, lvl); c.lineTo(618, lvl); c.lineTo(590, 478); c.lineTo(310, 478); c.closePath(); c.clip();

/* A clean-bone drawing used by the later stages. Colour follows S.spec. */
function boneColor() {
  const s = S.spec;
  let r = 226, g = 214, b = 187;
  const white = s.white || 0;
  r += 22 * white; g += 30 * white; b += 50 * white;
  r -= s.stain * 260; g -= s.stain * 300; b -= s.stain * 330;
  return `rgb(${Math.round(Math.min(250, r))},${Math.round(Math.min(248, g))},${Math.round(Math.min(240, b))})`;
}
function drawCleanSkeleton(c, opts = {}) {
  const parts = S.animal.art.skeleton();
  c.save();
  if (opts.y) c.translate(0, opts.y);
  for (const p of parts) {
    if (S.bones[p.group] && S.bones[p.group].have === 0) continue;
    c.fillStyle = boneColor(); c.fill(p.path); c.strokeStyle = 'rgba(110,98,74,.8)'; c.lineWidth = 1; c.stroke(p.path);
  }
  const [ox, oy] = S.animal.art.orbit; c.fillStyle = '#2b2522'; c.beginPath(); c.arc(ox, oy, 13, 0, 7); c.fill();
  if (opts.water) { c.fillStyle = opts.water; c.fillRect(40, 40, 820, 480); }
  // cracks drawn where they happened (random but stable)
  const r = rng(99); c.strokeStyle = '#3d3329'; c.lineWidth = 1.2;
  for (let i = 0; i < S.spec.cracks; i++) { const x = 200 + r() * 450, y = 240 + r() * 200; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 6, y + 5); c.lineTo(x + 3, y + 12); c.stroke(); }
  c.restore();
}

/* ============================== 6. GRADING =========================== */

/* Turn everything that happened into a score out of 100 and a letter. */
function computeGrade() {
  let score = 100;
  for (const e of S.mistakes) {
    const m = MISTAKES[e.key];
    if (m.q && !m.safety && !m.hide) score -= m.q * e.n;
  }
  score -= lostBonePenalty();
  // TODO(human): caps for damage a museum would treat as disqualifying.
  // Linear penalties alone let bleach + heat cracks + skipped degreasing still earn a C.
  // Useful inputs: hasMistake(key), S.spec.chalky / .infest / .cracks / .consolidated,
  // S.spec.greaseLeft, S.bones.cranium.have. Lower `score` here (e.g. Math.min(score, 60)).
  score = Math.max(0, Math.min(100, Math.round(score)));
  const letter = score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 55 ? 'D' : 'F';
  return { score, letter };
}

/* How the specimen looks six months after accession, given what's hidden in it. */
function sixMonthsLater() {
  const out = [];
  if (hasMistake('grease_left') || hasMistake('brain_left')) out.push('Yellow, slightly tacky patches have bloomed at the joint ends and the base of the skull. Grease is working its way out.');
  if (S.spec.chalky) out.push('The surface powders under a fingertip. A thin flake has come off the scapula.');
  if (S.spec.infest) out.push('There is fine frass under the box. Something is eating the specimen next to it.');
  if (S.spec.greaseCooked > .15 && !hasMistake('grease_left')) out.push('Faint amber shadows inside the long bones where cooked-in grease is surfacing.');
  if (S.spec.cracks && !S.spec.consolidated) out.push('Two of the cracks have opened a little further.');
  if (!out.length) out.push('Unchanged. Clean, stable, and dull in the best way.');
  return out;
}

function showGrade() {
  const g = computeGrade();
  const box = $('#modalBox'); box.className = 'box card'; box.innerHTML = '';
  const missing = Object.values(S.bones).reduce((a, b) => a + b.lost, 0), teethLost = S.teeth.filter(t => t.state === 'lost').length;
  const days = Math.round((S.hours - 8) / 24);
  box.append(el('div', { class: 'label-card' },
    el('div', { style: 'display:flex;justify-content:space-between;gap:12px;align-items:flex-start' },
      el('div', {},
        el('div', {}, `Cat. no. CARC-${new Date().getFullYear()}-${String(Math.floor(Math.random() * 900) + 100)}`),
        el('div', { style: 'font:italic 18px var(--serif);margin:4px 0' }, `${S.animal.taxon}`),
        el('div', {}, `${S.animal.name} · ${S.sex} · ${missing ? `skeleton, ${missing} elements missing` : 'complete skeleton'}`),
        el('div', {}, `Prep: ${METHODS[S.flags.macMethod]?.label.toLowerCase() || '—'}; ${S.spec.display === 'wire' ? 'articulated' : 'disarticulated, boxed'}`),
        el('div', {}, `Teeth: ${S.teeth.length - teethLost}/${S.teeth.length} · ${days} days start to finish`),
        S.saveHide ? el('div', {}, `Hide: ${Math.max(0, 100 - S.hide.damage)}% (side goal)`) : null),
      el('div', { style: 'text-align:right' }, el('div', { class: 'big' }, g.letter), el('div', {}, `${g.score}/100`),
        el('div', { style: `margin-top:6px;width:72px;height:22px;border-radius:4px;border:1px solid #9a8c70;background:${S.spec.chalky ? '#f4f2ec' : hasMistake('grease_left') ? '#d9c487' : boneColor()}`, title: 'Bone colour at six months' })))));
  box.append(el('h3', { style: 'margin-top:14px' }, 'Six months later'));
  for (const s of sixMonthsLater()) box.append(el('p', {}, s));

  const list = (title, pred) => {
    const ms = S.mistakes.filter(e => pred(MISTAKES[e.key]));
    if (!ms.length) return;
    box.append(el('h3', { style: 'margin-top:14px' }, title));
    for (const e of ms) {
      const m = MISTAKES[e.key];
      const pen = m.q ? `−${(m.q * e.n).toFixed(1).replace('.0', '')}` : '';
      box.append(el('div', { class: 'mist' + (m.hidden ? ' hidden-rev' : '') },
        pen ? el('span', { class: 'pen' }, pen) : null,
        el('b', {}, m.title + (e.n > 1 ? ` ×${e.n}` : '')),
        el('div', { class: 'c' }, m.cause + (e.details.length ? ` (${e.details.slice(0, 4).join('; ')})` : '')),
        el('div', { class: 'f' }, 'Preparator: ' + m.fix)));
    }
  };
  list('Specimen', m => !m.safety && !m.hide);
  const lostRows = Object.values(S.bones).filter(b => b.lost);
  if (lostRows.length || teethLost) {
    box.append(el('h3', { style: 'margin-top:14px' }, 'Missing elements'));
    for (const b of lostRows) box.append(el('div', { class: 'stat' }, el('span', {}, b.name), el('b', {}, `−${b.lost} (−${(b.lost * (b.weight || (b.small ? .6 : 2))).toFixed(1).replace('.0', '')})`)));
    if (teethLost) box.append(el('div', { class: 'stat' }, el('span', {}, 'Teeth'), el('b', {}, `−${teethLost} (−${(teethLost * 1.2).toFixed(1).replace('.0', '')})`)));
  }
  list('Your safety', m => m.safety);
  box.append(el('p', {}, `Contamination exposure: ${Math.round(S.contam)}/100. ${S.contam > 50 ? 'See a doctor if you get a fever, and mention the raccoon.' : S.contam > 20 ? 'Wash up well.' : 'Clean work.'}`));
  if (S.saveHide) list('Hide (side goal)', m => m.hide);
  box.append(el('div', { class: 'row', style: 'margin-top:14px' },
    el('button', { class: 'btn primary', onclick: () => { $('#modal').hidden = true; $('#log').innerHTML = ''; newGame(); goStage(0); } }, 'Prep another carcass')));
  $('#modal').hidden = false;
  log(`Graded ${g.letter} (${g.score}).`, 'ok');
}

/* ------------------------------ boot --------------------------------- */
newGame();
fit();
goStage(0);
log('A raccoon came in this morning. Gear up before you open the bag.');
</script>
</html>
