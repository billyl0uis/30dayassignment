<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carcass</title>
<style>
/* Layout: a steel prep bench. Header with stage rail and clock, scene (canvas + DOM overlay) left with meters above, notebook panel right. */
:root {
  --bg: #d8dbd6;
  --bg-2: #ccd0ca;
  --card: #eef0eb;
  --steel: #b6bcb7;
  --ink: #1f2321;
  --muted: #565d59;
  --dim: #858c87;
  --line: #b4bab4;
  --line-2: #9ba29c;
  --tag: #e9dcae;
  --tag-ink: #5a4a1e;
  --flesh: #a4473f;
  --blood: #6e2420;
  --bile: #7a7631;
  --ok: #2e5a45;
  --warn: #a2651c;
  --bad: #8e2c25;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- header ---------- */
.top {
  display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap;
  padding: 10px max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line-2); background: var(--bg-2);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 700 23px/1 var(--serif); letter-spacing: -0.01em; }
.brand em { font: italic 14px var(--serif); color: var(--muted); white-space: nowrap; }
.rail { display: flex; gap: 3px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.rail li {
  font: 500 11.5px var(--mono); padding: 3px 7px; border-radius: 5px; border: 1px solid var(--line);
  color: var(--dim); background: var(--card); white-space: nowrap;
}
.rail li.done { color: var(--ok); border-color: #9fb8aa; }
.rail li.now { color: #f1efe6; background: var(--ink); border-color: var(--ink); }
.top-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.clock { font: 500 13px var(--mono); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; white-space: nowrap; }
.chip { border: 1px solid var(--line-2); background: var(--card); padding: 4px 11px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--muted); }
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--ink); background: #fff7dc; border-color: var(--warn); }

/* ---------- main ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
.bench { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.meter { min-width: 0; }
.meter .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.meter .lbl b { font: 600 12px var(--mono); color: var(--ink); }
.bar { height: 7px; border-radius: 4px; background: var(--card); border: 1px solid var(--line); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; width: 0; transition: width .4s, background .4s; }
.stage { position: relative; min-height: 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 45%, #c9cec9 0%, #b3b9b4 70%, #a6ada7 100%); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.overlay > * { pointer-events: auto; }
.hint {
  position: absolute; left: 12px; bottom: 12px; max-width: min(520px, calc(100% - 24px));
  background: rgba(31,35,33,.86); color: #ecebe4; font-size: 13px; padding: 7px 11px; border-radius: 7px; pointer-events: none;
}

/* ---------- side panel ---------- */
.panel { border-left: 1px solid var(--line-2); background: var(--card); display: flex; flex-direction: column; min-height: 0; }
.panel-body { overflow-y: auto; padding: 14px 16px 18px; flex: 1; min-height: 0; }
.panel h2 { font: 700 21px/1.15 var(--serif); margin: 0 0 4px; }
.panel .kicker { font: 500 11.5px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.panel p { margin: 6px 0 10px; color: var(--muted); }
.panel h3 { font: 600 13px var(--sans); margin: 14px 0 6px; color: var(--ink); }
.btn {
  border: 1px solid var(--line-2); background: #fff; padding: 7px 12px; border-radius: 7px; cursor: pointer;
  font-size: 13.5px; text-align: left;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: #f1efe6; border-color: var(--ink); }
.btn.on { background: #fff7dc; border-color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.opts { display: grid; gap: 6px; }
.opt { display: block; width: 100%; }
.opt small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.why { display: inline-block; margin-left: 6px; font: 600 11px var(--mono); color: var(--warn); border-bottom: 1px dotted var(--warn); cursor: help; }
.gauge { font: 12px var(--mono); color: var(--muted); }
.gauge .bar { height: 10px; }
.stat { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; border-bottom: 1px dashed var(--line); }
.stat b { font: 600 12.5px var(--mono); }
.next { margin-top: 14px; }
.log { border-top: 1px solid var(--line); max-height: 30%; overflow-y: auto; padding: 8px 16px 10px; font-size: 12.5px; background: var(--bg-2); }
.log div { padding: 2px 0; color: var(--muted); }
.log div.warn { color: var(--warn); }
.log div.bad { color: var(--bad); }
.log div.ok { color: var(--ok); }
.log time { font: 11px var(--mono); color: var(--dim); margin-right: 6px; }
input[type=range] { width: 100%; accent-color: var(--ink); }

/* checklist */
.check { font-size: 12.5px; }
.check .stat span.lost { color: var(--bad); }
.check .stat span.risk { color: var(--warn); }

/* tray items (stage 5) and tooth chips (stage 7) */
.item {
  position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; cursor: grab; touch-action: none;
  display: grid; place-items: center; border-radius: 50%; user-select: none;
}
.item:active { cursor: grabbing; }
.item svg { width: 40px; height: 40px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.bag {
  position: absolute; width: 112px; min-height: 92px; border: 2px dashed #7f8781; border-radius: 9px; background: rgba(238,240,235,.82);
  padding: 6px; font-size: 12px; text-align: center; display: flex; flex-direction: column; gap: 3px; align-items: center;
}
.bag.hot { border-color: var(--ok); background: rgba(225,239,230,.95); }
.bag.discard { border-color: var(--bad); }
.bag .tagl { font: 600 11px var(--mono); background: var(--tag); color: var(--tag-ink); padding: 1px 6px; border-radius: 3px; }
.bag .tagl.blank { background: #fff; color: var(--dim); cursor: pointer; border: 1px solid var(--line); }
.bag .cnt { font: 11px var(--mono); color: var(--muted); }
.teeth { display: grid; gap: 4px; }
.jaw { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 2px; }
.sock { aspect-ratio: 1/1.5; border: 1px solid var(--line-2); border-radius: 4px; display: grid; place-items: center; font: 600 10px var(--mono); background: #f5f2e8; cursor: pointer; }
.sock.full { background: #e6dcc4; color: var(--ink); }
.sock.empty { background: #3a3532; color: #b8b0a4; }
.sock.lost { background: repeating-linear-gradient(45deg, #3a3532 0 3px, #5a4f49 3px 6px); color: #c9a5a0; }
.tchip { padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 12px; background: #fff; cursor: pointer; font: 12px var(--mono); }
.tchip.sel { background: var(--ink); color: #f1efe6; }

/* tooltip */
#tip {
  position: fixed; z-index: 50; max-width: 300px; background: #1f2321; color: #ecebe4; font-size: 12.5px; line-height: 1.45;
  padding: 8px 10px; border-radius: 7px; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}

/* modal (events, choices) */
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(20,22,21,.45); padding: 16px; }
.modal .box { background: var(--card); border-radius: 12px; max-width: 520px; width: 100%; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); max-height: 90vh; overflow-y: auto; }
.modal h3 { font: 700 20px/1.2 var(--serif); margin: 0 0 6px; }
.modal p { color: var(--muted); margin: 6px 0 12px; }

/* grade card */
.card { max-width: 760px !important; }
.label-card { border: 1px solid var(--line-2); background: #fbf8ee; padding: 12px 14px; border-radius: 6px; font: 13px var(--mono); }
.label-card .big { font: 700 44px/1 var(--serif); }
.mist { border-top: 1px solid var(--line); padding: 8px 0; }
.mist b { font-size: 14px; }
.mist .c { color: var(--muted); font-size: 13px; }
.mist .f { font-size: 13px; color: var(--ok); }
.mist .pen { float: right; font: 600 12px var(--mono); color: var(--bad); }
.mist.hidden-rev b::after { content: " · revealed at grading"; font: 500 11px var(--mono); color: var(--warn); }

@media (max-width: 860px) {
  body { overflow: auto; grid-template-rows: auto auto; }
  main { grid-template-columns: 1fr; }
  .bench { grid-template-rows: auto 62vh; }
  .panel { border-left: 0; border-top: 1px solid var(--line-2); }
  .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rail { order: 3; width: 100%; }
  .bag { width: 84px; min-height: 70px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<header class="top">
  <div class="brand"><b>Carcass</b><em>a specimen prep bench</em></div>
  <ol class="rail" id="rail" aria-label="Stages"></ol>
  <div class="top-right">
    <span class="clock" id="clock">Day 0 · 08:00</span>
    <button class="chip" id="soundBtn" aria-pressed="false">Sound off</button>
  </div>
</header>

<main>
  <section class="bench">
    <div class="meters">
      <div class="meter" data-tip="How bad the room smells. Rises with rotting tissue, punctured gut and foul water. Falls slowly with time and ventilation."><div class="lbl">Stench <b id="mStenchV">0</b></div><div class="bar"><i id="mStench"></i></div></div>
      <div class="meter" data-tip="Your exposure to pathogens. Raccoons can carry raccoon roundworm (Baylisascaris procyonis) eggs in faeces, rabies in brain and saliva, and leptospirosis in urine. Missing PPE multiplies every spike. It never goes down."><div class="lbl">Contamination <b id="mContamV">0</b></div><div class="bar"><i id="mContam"></i></div></div>
      <div class="meter" data-tip="Total time since the carcass arrived. Some steps take hours, maceration and degreasing take weeks."><div class="lbl">Time elapsed <b id="mTimeV">0 d</b></div><div class="bar"><i id="mTime"></i></div></div>
      <div class="meter" data-tip="Your running estimate of the specimen's quality. Some damage (grease, bleach) doesn't show until later, so this can be optimistic."><div class="lbl">Specimen quality <b id="mQualV">100</b></div><div class="bar"><i id="mQual"></i></div></div>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="overlay" id="overlay"></div>
      <div class="hint" id="hint" hidden></div>
    </div>
  </section>
  <aside class="panel">
    <div class="panel-body" id="panel"></div>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>
</main>

<div id="tip" hidden></div>
<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>

<script>
'use strict';
/* =====================================================================
   CARCASS — a natural-history bone prep simulator.
   One file, no libraries. Structure:
     1. DATA      animals, decomposition states, mistakes
     2. STATE     the single save object S and helpers that change it
     3. UI KIT    DOM builder, meters, log, tooltip, modal, sound
     4. SCENE     canvas engine, flies and smell lines
     5. STAGES    one object per stage in STAGES[], each with mount()
     6. GRADING   final score and the specimen card
   To add an animal: add an entry to ANIMALS with the same keys as
   the raccoon (bones, teeth, art). Stage code reads only from S.animal.
   ===================================================================== */

/* ============================== 1. DATA ============================== */

/* Small geometry helpers used by the animal art tables. Everything is in
   the scene's logical coordinate space, W x H = 900 x 560. */
const W = 900, H = 560;
function capPath(x1, y1, x2, y2, r) {
  const p = new Path2D(), a = Math.atan2(y2 - y1, x2 - x1);
  p.arc(x1, y1, r, a + Math.PI / 2, a - Math.PI / 2);
  p.arc(x2, y2, r, a - Math.PI / 2, a + Math.PI / 2);
  p.closePath();
  return p;
}
function ellPath(x, y, rx, ry, rot = 0) { const p = new Path2D(); p.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); return p; }
function polyPath(pts) { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); return p; }
function distSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / L));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

/* Skeleton art (lateral, facing left) for the raccoon. Each part names the
   bone group it belongs to so a nick can be charged to the right bone. */
function raccoonSkeleton() {
  const parts = [];
  const add = (group, path, kind = 'bone') => parts.push({ group, path, kind });
  // skull
  const skull = ellPath(188, 240, 62, 40, -0.06);
  skull.addPath(polyPath([[134, 222], [82, 238], [80, 256], [134, 266]]));
  add('cranium', skull);
  add('mandible', polyPath([[86, 262], [200, 268], [222, 248], [234, 284], [206, 294], [92, 278]]));
  // spine: [group, count, x0, x1, base y, arch, size]
  const runs = [['cervical', 7, 252, 330, 252, 0, 9], ['thoracic', 14, 336, 510, 254, 12, 7.5], ['lumbar', 6, 518, 598, 252, 4, 11]];
  for (const [g, n, x0, x1, y0, arch, s] of runs) {
    for (let i = 0; i < n; i++) {
      const u = n === 1 ? 0 : i / (n - 1), x = x0 + (x1 - x0) * u, y = y0 - arch * Math.sin(Math.PI * u);
      add(g, capPath(x - s * .55, y, x + s * .55, y, s * .8));
    }
  }
  add('sacrum', capPath(606, 260, 642, 268, 10));
  for (let i = 0; i < 20; i++) {
    const u = i / 19, x = 652 + 210 * u, y = 272 + 110 * u * u, s = 8 - 5 * u;
    add('caudal', capPath(x - s * .7, y, x + s * .7, y + 1, s * .6));
  }
  // ribs: two-segment curves from the spine down and back
  for (let i = 0; i < 13; i++) {
    const x = 344 + i * 12.5, top = 258 - 10 * Math.sin(Math.PI * i / 13), len = 118 - Math.abs(i - 5) * 5;
    const r = new Path2D();
    r.addPath(capPath(x, top, x + 10, top + len * .55, 3));
    r.addPath(capPath(x + 10, top + len * .55, x + 4 - i * 2, top + len, 3));
    add('ribs', r);
  }
  for (let i = 0; i < 8; i++) add('sternum', capPath(352 + i * 13, 382, 360 + i * 13, 384, 4));
  // limbs
  add('scapula', polyPath([[318, 264], [378, 262], [346, 332]]));
  add('humerus', capPath(345, 326, 320, 402, 9));
  add('radius', capPath(320, 404, 330, 482, 6));
  add('ulna', capPath(328, 398, 340, 480, 5));
  add('carpals', capPath(332, 486, 300, 502, 6));
  add('pelvis', polyPath([[588, 262], [652, 262], [668, 300], [640, 322], [614, 304]]));
  add('femur', capPath(640, 302, 614, 396, 9));
  add('tibia', capPath(614, 400, 650, 482, 7));
  add('fibula', capPath(624, 400, 658, 478, 3));
  add('tarsals', capPath(652, 486, 598, 506, 6));
  return parts;
}

/* Soft tissue outline used to seed the defleshing grid: [path, starting thickness]. */
function raccoonMuscle() {
  return [
    [ellPath(452, 300, 205, 98), 1.0],
    [ellPath(288, 268, 70, 46), 0.95],
    [ellPath(178, 248, 84, 48), 0.45],
    [capPath(340, 300, 326, 482, 24), 0.85],
    [capPath(630, 290, 622, 398, 32), 1.0],
    [capPath(622, 398, 650, 482, 18), 0.7],
    [capPath(652, 272, 760, 320, 12), 0.35],
    [capPath(760, 320, 866, 382, 7), 0.25],
    [capPath(334, 486, 298, 503, 11), 0.3],
    [capPath(654, 486, 596, 507, 11), 0.3],
  ];
}

/* ANIMALS: everything species-specific lives here.
   bones:  checklist groups. n = how many elements. small = easy to lose.
           feet:'fore'|'hind' marks foot bones; maleOnly drops it for females.
   teeth:  formula per quadrant; 'canFall' lists single-rooted types that
           slip out during maceration.
   art:    coordinates for the ventral (skinning/evisceration) and lateral
           (defleshing) scenes. */
const ANIMALS = {
  raccoon: {
    id: 'raccoon', name: 'Raccoon', taxon: 'Procyon lotor', massKg: 6.8,
    fur: ['#7f7b73', '#a59f93', '#3b3834'],
    bones: [
      { id: 'cranium', name: 'Cranium', n: 1, weight: 30 },
      { id: 'mandible', name: 'Mandibles (L, R)', n: 2, weight: 10 },
      { id: 'hyoid', name: 'Hyoid apparatus', n: 1, small: true, weight: 3 },
      { id: 'cervical', name: 'Cervical vertebrae', n: 7 },
      { id: 'thoracic', name: 'Thoracic vertebrae', n: 14 },
      { id: 'lumbar', name: 'Lumbar vertebrae', n: 6 },
      { id: 'sacrum', name: 'Sacrum', n: 1 },
      { id: 'caudal', name: 'Caudal vertebrae', n: 20, small: true },
      { id: 'ribs', name: 'Ribs', n: 28 },
      { id: 'sternum', name: 'Sternebrae', n: 8, small: true },
      { id: 'scapula', name: 'Scapulae', n: 2, weight: 4 },
      { id: 'humerus', name: 'Humeri', n: 2, weight: 4 },
      { id: 'radius', name: 'Radii', n: 2, weight: 3 },
      { id: 'ulna', name: 'Ulnae', n: 2, weight: 3 },
      { id: 'carpals', name: 'Carpals', n: 14, small: true, feet: 'fore' },
      { id: 'metacarpals', name: 'Metacarpals', n: 10, small: true, feet: 'fore' },
      { id: 'foreph', name: 'Fore phalanges', n: 28, small: true, feet: 'fore' },
      { id: 'pelvis', name: 'Os coxae (L, R)', n: 2, weight: 4 },
      { id: 'femur', name: 'Femora', n: 2, weight: 4 },
      { id: 'patella', name: 'Patellae', n: 2, small: true },
      { id: 'tibia', name: 'Tibiae', n: 2, weight: 3 },
      { id: 'fibula', name: 'Fibulae', n: 2 },
      { id: 'tarsals', name: 'Tarsals', n: 14, small: true, feet: 'hind' },
      { id: 'metatarsals', name: 'Metatarsals', n: 10, small: true, feet: 'hind' },
      { id: 'hindph', name: 'Hind phalanges', n: 28, small: true, feet: 'hind' },
      { id: 'sesamoids', name: 'Sesamoids', n: 8, small: true },
      { id: 'baculum', name: 'Baculum', n: 1, small: true, maleOnly: true, weight: 2 },
    ],
    teeth: { formula: ['I', 'I', 'I', 'C', 'P', 'P', 'P', 'P', 'M', 'M'], canFall: ['I', 'C', 'P1'] },
    art: { skeleton: raccoonSkeleton, muscle: raccoonMuscle, orbit: [150, 236], foramen: [238, 262] },
  },
  /* To add more, copy the raccoon's shape. Sketches:
     rabbit:     { bones: [... no baculum, 16 caudals, fragile nasal bones ...], teeth: formula I2/1 ... (lagomorph peg teeth) }
     deerSkull:  { skull-only: bones: cranium, mandibles, antler pedicles; skip skinning legs; art.skeleton returns just the skull }
     bird:       { bones: pneumatic, very fragile (boost nick risk), no teeth (teeth: null), sclerotic rings as small bones } */
};

/* Decomposition state changes how every stage behaves. */
const DECOMP = {
  fresh: {
    label: 'Fresh', blurb: 'Roadside, found this morning. Still limp, no smell yet.',
    stench: 6, peelRate: 1, peelTension: 1, skinWall: 1.35, gutSize: 1, gutWobble: 2, deflesh: 1, nickMul: 1, wet: 0.7, macMul: 1, hideSlip: false,
  },
  bloated: {
    label: 'Bloated', blurb: 'Under a porch for four August days. Swollen, green-tinged belly, fur slipping.',
    stench: 42, peelRate: 1.6, peelTension: 0.7, skinWall: 0.9, gutSize: 1.45, gutWobble: 5, deflesh: 1.4, nickMul: 0.85, wet: 1, macMul: 1.4, hideSlip: true,
  },
  dried: {
    label: 'Dried', blurb: 'Behind a shed since spring. Leathery, sunken, flesh like jerky.',
    stench: 14, peelRate: 0.45, peelTension: 1.6, skinWall: 2.4, gutSize: 0.7, gutWobble: 0.5, deflesh: 0.55, nickMul: 1.6, wet: 0.15, macMul: 0.6, hideSlip: false,
  },
};

/* MISTAKES: every way to go wrong. Penalties are in quality points.
   hidden:true  = not shown on the live quality meter; revealed at grading.
   safety:true  = affects you, not the bone; listed separately.
   hide:true    = side-goal hide damage only.
   'fix' is the note a working preparator would leave. */
const MISTAKES = {
  ppe_gloves: { title: 'Worked without nitrile gloves', safety: true, cause: 'Bare hands in body fluids.', fix: 'Nitrile gloves, changed whenever they tear. Raccoon roundworm eggs and leptospires enter through cuts and mouths.' },
  ppe_cotton: { title: 'Cotton work gloves', safety: true, cause: 'Cloth wicks fluid straight to your skin and stays wet.', fix: 'Fabric gloves are for handling clean bone. Wet work wants nitrile.' },
  ppe_mask: { title: 'No mask', safety: true, cause: 'Aerosols from flushing and spraying went unfiltered.', fix: 'An N95 or half-face respirator during flushing, scraping dried tissue, and any time water is sprayed.' },
  ppe_eyes: { title: 'No eye protection', safety: true, cause: 'Splash-back reaches the eyes during gut puncture and brain flushing.', fix: 'Safety glasses or a face shield. Mucous membranes are an easy way in.' },
  workspace: { title: 'Prepped in a food area', safety: true, cause: 'Kitchen surfaces got carcass fluid on them.', fix: 'Outdoors on a tarp, or a dedicated bench you can bleach. Never where food goes.' },
  incision_deep: { title: 'Cut through the abdominal wall', q: 2, cause: 'The skin incision went too deep over the belly.', fix: 'Lift the skin with forceps and cut blade-edge-up, just through the hide. Let the muscle wall keep the gut contained.' },
  incision_ragged: { title: 'Ragged incision', hide: true, cause: 'The cut wandered off the midline.', fix: 'Mark the midline first and work slowly. A straight seam is far easier to sew back for a study skin.' },
  hide_tear: { title: 'Tore the hide', hide: true, cause: 'Pulled harder than the connective tissue could give.', fix: 'Peel in short pulls and let the skin relax between them. Use the blade to free stuck fascia instead of yanking.' },
  hide_slip: { title: 'Fur slipping on a bloated hide', hide: true, cause: 'Decomposition loosened the hair follicles before you got to it.', fix: 'Once hair slips, the hide is rarely saveable. Freeze fresh finds quickly if you want the skin.' },
  feet_in_hide: { title: 'Left foot bones in the hide', q: 0, cause: 'Cutting at the wrist or ankle left carpals, metapodials and phalanges inside the skin.', fix: 'For a skeleton, skin out every toe, or take the foot off whole and macerate it skin-on. The skin sloughs and the bones stay together.' },
  tail_snapped: { title: 'Tail snapped while stripping', q: 0, cause: 'Pulling the tail core out too hard tore off the last caudal vertebrae, which stayed in the skin.', fix: 'Slit the tail skin along the underside, or ease the core out with a tail stripper in small pulls.' },
  gut_puncture: { title: 'Punctured the gut', q: 3, cause: 'The blade crossed the stomach or intestine.', fix: 'Keep the blade on the attachment, not the organ. Lift loops aside with a gloved finger before cutting mesentery.' },
  bladder_puncture: { title: 'Punctured the bladder', q: 1, cause: 'Urine spilled into the cavity.', fix: 'Tie or clamp the bladder neck and lift it out whole.' },
  untied_gut: { title: 'Cut the gut without tying it off', q: 1.5, cause: 'Gut contents leaked from the open end.', fix: 'Tie a ligature (or a cable tie) around the oesophagus and the colon first, then cut on the far side of the tie.' },
  organ_torn: { title: 'Tore an organ out', q: 0.5, cause: 'Pulled before all its attachments were cut.', fix: 'Free every attachment first. Torn organs spray and smear.' },
  hyoid_lost: { title: 'Threw out the hyoid', q: 0, cause: 'The hyoid sits in the throat and went into the bucket with the tongue and windpipe.', fix: 'Before discarding the pluck, feel for the hyoid at the base of the tongue and cut it free.' },
  bone_nick: { title: 'Nicked bone with the blade', q: 1.2, cause: 'Kept scraping after the tissue was gone.', fix: 'Gross defleshing is about bulk. Stop at a thin film and let maceration or beetles finish. Switch to a scalpel near bone.' },
  orbit_nick: { title: 'Gouged the orbit', q: 2, cause: 'Used a knife on the eye.', fix: 'Scoop eyes with a small spoon or curette, working around the globe.' },
  eyes_left: { title: 'Left the eyes in', q: 1, cause: 'The eyes rotted in place during maceration.', fix: 'Remove eyes early; they hold fluid and fat.' },
  ethmoid_break: { title: 'Broke the ethmoid / turbinates', q: 4, cause: 'Jabbing a wire through the braincase shattered the paper-thin bones behind the nose.', fix: 'Stir gently, flush with water through the foramen magnum, and let water do the work.' },
  brain_left: { title: 'Left the brain in', q: 3, hidden: true, cause: 'Brain is mostly fat. It rotted inside the braincase and soaked grease into it.', fix: 'Flush the brain out through the foramen magnum with a hose or syringe before maceration.' },
  small_discarded: { title: 'Discarded a bone as tissue', q: 0, cause: 'A small bone went in the waste bucket.', fix: 'When in doubt, bag it. Gristle can be thrown out later; a sesamoid cannot be found again.' },
  tissue_bagged: { title: 'Bagged tissue with bones', q: 0.3, cause: 'Gristle in a bone bag rots and stains its neighbours.', fix: 'Cartilage bends, tendon is stringy, fat is greasy. Bone is hard and doesn\'t give.' },
  mislabeled: { title: 'Bone in the wrong bag', q: 1, cause: 'The bag label now lies about what is inside.', fix: 'Check each element against a reference before it goes in. A mislabeled bag can wreck a later identification.' },
  unlabeled: { title: 'Unlabeled bags', q: 2, cause: 'Bags without tags got mixed up during maceration.', fix: 'Pencil on Tyvek or acid-free card, inside the bag. Ink runs, marker fades.' },
  small_left: { title: 'Left small bones on the tray', q: 0, cause: 'Loose bones were cleared away with the scraps.', fix: 'Sweep the tray into a sieve, not a bin.' },
  beetles_wet: { title: 'Gave beetles a wet specimen', q: 1, cause: 'Dermestids avoid wet tissue; it moulded and the colony suffered.', fix: 'Dry the specimen until the flesh is leathery before it goes in the tank.' },
  colony_died: { title: 'Lost the beetle colony', q: 2, cause: 'The colony crashed from cold, heat, mould or hunger.', fix: 'Keep a colony around 26–28 °C, dry, ventilated, and fed between specimens.' },
  not_frozen: { title: 'Didn\'t freeze after beetles', q: 8, cause: 'Live larvae and eggs rode out on the bones. Dermestids loose in a collection eat specimens.', fix: 'A week in the freezer (or two freeze cycles) before a specimen leaves the beetle room. Museums are strict about this.' },
  rancid: { title: 'Let maceration water go rancid', q: 4, cause: 'Foul water sat too long and tea-stained the bone.', fix: 'Change water when it goes opaque, and keep a cup of old water as a bacterial starter.' },
  teeth_dumped: { title: 'Poured teeth down the drain', q: 0, cause: 'Loose teeth were in the water you threw out.', fix: 'Pour every change through a fine sieve or a paint strainer.' },
  small_dumped: { title: 'Poured foot bones away', q: 0, cause: 'Small bones loosened from whole-macerated feet went out with the water.', fix: 'Sieve every pour, or keep feet in a mesh bag inside the bucket.' },
  residual: { title: 'Pulled the specimen with tissue on it', q: 5, cause: 'Soft tissue remained when maceration stopped. It hardens and stains.', fix: 'Finish maceration completely; tissue left on now will not come off in degreasing.' },
  boiled: { title: 'Boiled the bones', q: 3, cause: 'A rolling boil cracks bone, pops teeth, and sets grease into it.', fix: 'Hold a bare simmer, around 80–90 °C, with the lid ajar. Watch it.' },
  cooked_grease: { title: 'Cooked grease into the bone', q: 0, hidden: true, cause: 'Heat drives fat into the bone where degreasing struggles to reach it.', fix: 'Keep heat low or avoid it. Cold or warm maceration leaves grease mobile.' },
  burial_stain: { title: 'Soil staining', q: 4, cause: 'Tannins and minerals in the soil dyed the bone brown.', fix: 'Burial is easy but stains. Use a mesh bag, sand or leaf-poor soil, and expect to accept some colour.' },
  scavenged: { title: 'Scavenger dug up the burial', q: 0, cause: 'Something dug in and carried bones off.', fix: 'Bury in a mesh bag, under a weighted crate or paving slab.' },
  heater_cooked: { title: 'Warm bath ran too hot', q: 1, cause: 'Above about 40 °C the bacteria die off and grease starts to set.', fix: 'Aim for 29–35 °C (85–95 °F). An aquarium heater and a thermometer, checked daily.' },
  teeth_lost: { title: 'Teeth lost', q: 0, cause: 'Loose teeth went missing during maceration.', fix: 'Collect teeth at every water change and store them in a labeled vial.' },
  tooth_wrong: { title: 'Seated a tooth in the wrong socket', q: 1, cause: 'Wrong tooth type for that socket.', fix: 'Match root count and crown shape. Dry-fit before gluing.' },
  grease_left: { title: 'Degreasing cut short', q: 0, hidden: true, cause: 'Fat left in the bone seeps out over months, yellowing it and making it tacky.', fix: 'Soak in warm water and dish soap, change it whenever it clouds, and keep going until fresh water stays clear for a week.' },
  bleach: { title: 'Whitened with household bleach', q: 15, hidden: true, cause: 'Sodium hypochlorite eats the collagen that holds bone together. It looks white, then turns chalky and flakes.', fix: 'Hydrogen peroxide (3% soak or 12% developer paste) whitens without destroying the protein matrix.' },
  peroxide_long: { title: 'Left strong peroxide on too long', q: 2, cause: 'Days under 12% peroxide etched the bone surface.', fix: 'A day or two is plenty at 12%. Check every few hours.' },
  heat_dry: { title: 'Forced drying with heat', q: 6, cause: 'Uneven heat shrinks the outside before the inside; bone and teeth crack.', fix: 'Air-dry slowly in the shade for several days.' },
  superglue: { title: 'Superglued the teeth', q: 2, cause: 'Cyanoacrylate is irreversible and yellows. A curator can\'t undo it.', fix: 'Use a reversible conservation adhesive such as Paraloid B-72, or leave teeth loose in a labeled vial.' },
  consolidant_over: { title: 'Consolidant on sound bone', q: 1, cause: 'Coated healthy bone; it went glossy and plasticky.', fix: 'Consolidate only fragile, cracked or chalky elements, with a thin solution.' },
};

/* ============================== 2. STATE ============================= */

/* S is the whole game. Every stage reads and writes it; nothing else holds state. */
let S;
function newGame(animalId = 'raccoon') {
  const A = ANIMALS[animalId];
  const sex = Math.random() < 0.5 ? 'male' : 'female';
  const bones = {};
  for (const b of A.bones) {
    if (b.maleOnly && sex !== 'male') continue;
    bones[b.id] = { ...b, have: b.n, lost: 0, bagged: false };
  }
  const teeth = [];
  for (const jaw of ['U', 'L']) for (const side of ['R', 'L']) {
    let p = 0;
    A.teeth.formula.forEach((type, i) => {
      if (type === 'P') p++;
      const code = type === 'P' ? 'P' + p : type;
      teeth.push({ id: `${jaw}${side}${i}`, jaw, side, type, code, slot: i, state: 'seated', canFall: A.teeth.canFall.includes(type) || A.teeth.canFall.includes(code) });
    });
  }
  S = {
    animal: A, decomp: null, sex, saveHide: false,
    ppe: {}, workspace: null,
    hours: 8, stench: 0, contam: 0,
    mistakes: [], bones, teeth,
    hide: { damage: 0 },
    // spec holds the bone's physical condition; grading reads it.
    spec: { stain: 0, grease: 0.5, greaseCooked: 0, cracks: 0, residual: 0, chalky: false, infest: false, nicks: 0, brainLeft: false, consolidated: false, display: null },
    tray: [],           // loose small items produced by earlier stages, sorted in stage 5
    flags: {},          // one-off decisions (feet choices, tail method, ...)
    stage: 0,
  };
}

/* Record a mistake. Repeats of the same key stack into one entry with a count. */
function addMistake(key, detail) {
  const m = MISTAKES[key];
  let e = S.mistakes.find(x => x.key === key);
  if (!e) { e = { key, n: 0, details: [] }; S.mistakes.push(e); }
  e.n++;
  if (detail && !e.details.includes(detail)) e.details.push(detail);
  if (!m.hidden) log(m.title + (detail ? ` (${detail})` : ''), m.safety ? 'warn' : 'bad');
  updateMeters();
}
function hasMistake(key) { return S.mistakes.some(x => x.key === key); }

/* Lose k bones from a group. Loss is permanent and charged to the cause. */
function loseBones(id, k, causeKey) {
  const b = S.bones[id];
  if (!b) return 0;
  k = Math.min(k, b.have);
  if (k <= 0) return 0;
  b.have -= k; b.lost += k;
  log(`Lost ${k} × ${b.name.toLowerCase()}`, 'bad');
  if (causeKey) addMistake(causeKey, `${k} ${b.name.toLowerCase()}`);
  updateMeters();
  return k;
}

/* PPE multiplies every exposure. Which items matter depends on the splash type. */
function expose(amount, kinds = ['hands']) {
  let mul = 1;
  if (kinds.includes('hands')) mul *= S.ppe.gloves === 'nitrile' ? 0.25 : S.ppe.gloves === 'cotton' ? 1.4 : 1.8;
  if (kinds.includes('eyes') && !S.ppe.eyes) mul *= 1.6;
  if (kinds.includes('air') && !S.ppe.mask) mul *= 1.5;
  if (S.workspace === 'kitchen') mul *= 1.3;
  S.contam = Math.min(100, S.contam + amount * mul);
  updateMeters();
}
function stink(amount) { S.stench = Math.max(0, Math.min(100, S.stench + amount)); updateMeters(); }

/* Advance the clock. Stench drifts toward a floor set by what's on the bench. */
function advance(hours, stenchFloor = null) {
  S.hours += hours;
  if (stenchFloor != null) S.stench += (stenchFloor - S.stench) * Math.min(1, hours / 24);
  updateMeters();
}

/* Live quality estimate: visible penalties plus lost bones. Hidden damage is not counted here. */
function liveQuality() {
  let q = 100;
  for (const e of S.mistakes) { const m = MISTAKES[e.key]; if (!m.hidden && m.q) q -= m.q * e.n; }
  q -= lostBonePenalty();
  return Math.max(0, Math.round(q));
}
function lostBonePenalty() {
  let p = 0;
  for (const b of Object.values(S.bones)) if (b.lost) p += b.lost * (b.weight || (b.small ? 0.6 : 2));
  p += S.teeth.filter(t => t.state === 'lost').length * 1.2;
  return p;
}

/* ============================== 3. UI KIT ============================ */

const $ = s => document.querySelector(s);
/* el('div', {class:'x', onclick: fn}, child, 'text', ...) */
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
/* A "why?" tag that shows the reasoning behind an option on hover or tap. */
const why = text => el('span', { class: 'why', 'data-tip': text, tabindex: 0 }, 'why?');

function fmtTime(h) {
  const d = Math.floor(h / 24), hh = Math.floor(h % 24), mm = Math.floor((h % 1) * 60);
  return `Day ${d} · ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function fmtSpan(h) {
  const d = (h - 8) / 24;
  return d < 1 ? `${Math.round(h - 8)} h` : d < 14 ? `${d.toFixed(1)} d` : `${(d / 7).toFixed(1)} wk`;
}
function updateMeters() {
  if (!S) return;
  const set = (id, v, color) => { const b = $('#' + id); b.style.width = Math.min(100, v) + '%'; b.style.background = color; };
  const ramp = v => v < 34 ? '#6f8f7c' : v < 67 ? '#b0812e' : '#8e2c25';
  set('mStench', S.stench, ramp(S.stench)); $('#mStenchV').textContent = Math.round(S.stench);
  set('mContam', S.contam, ramp(S.contam)); $('#mContamV').textContent = Math.round(S.contam);
  const days = (S.hours - 8) / 24;
  set('mTime', Math.min(100, days / 90 * 100), '#5b6a73'); $('#mTimeV').textContent = fmtSpan(S.hours);
  const q = liveQuality();
  set('mQual', q, q > 75 ? '#2e5a45' : q > 50 ? '#b0812e' : '#8e2c25'); $('#mQualV').textContent = q;
  $('#clock').textContent = fmtTime(S.hours);
}

function log(msg, kind = '') {
  const L = $('#log');
  L.prepend(el('div', { class: kind }, el('time', {}, S ? fmtTime(S.hours).replace('Day ', 'D') : ''), msg));
  while (L.children.length > 80) L.lastChild.remove();
}

function setHint(text) { const h = $('#hint'); h.hidden = !text; h.textContent = text || ''; }

/* Tooltip: any element with data-tip. Works with hover, keyboard focus and tap. */
(() => {
  const tip = $('#tip');
  const show = (t, x, y) => {
    tip.textContent = t; tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 14)) + 'px';
    tip.style.top = Math.max(8, Math.min(innerHeight - r.height - 8, y + 14)) + 'px';
  };
  const find = e => e.target.closest && e.target.closest('[data-tip]');
  document.addEventListener('pointerover', e => { const t = find(e); if (t) show(t.dataset.tip, e.clientX, e.clientY); });
  document.addEventListener('pointermove', e => { const t = find(e); if (t) show(t.dataset.tip, e.clientX, e.clientY); else tip.hidden = true; });
  document.addEventListener('focusin', e => { const t = find(e); if (t) { const r = t.getBoundingClientRect(); show(t.dataset.tip, r.left, r.bottom); } });
  document.addEventListener('focusout', () => tip.hidden = true);
})();

/* Modal with a title, body and choice buttons. Returns a promise of the chosen value. */
function ask(title, body, choices) {
  return new Promise(res => {
    const box = $('#modalBox'); box.className = 'box'; box.innerHTML = '';
    box.append(el('h3', {}, title));
    if (typeof body === 'string') box.append(el('p', {}, body)); else if (body) box.append(body);
    const opts = el('div', { class: 'opts' });
    for (const c of choices) {
      opts.append(el('button', { class: 'btn opt' + (c.primary ? ' primary' : ''), onclick: () => { $('#modal').hidden = true; res(c.value); } },
        c.label, c.note ? el('small', {}, c.note) : null));
    }
    box.append(opts);
    $('#modal').hidden = false;
    opts.querySelector('button').focus();
  });
}

/* ---------- sound: synthesised, off by default ---------- */
const SND = {
  on: false, ac: null, noise: null, buzzGain: null,
  init() {
    if (this.ac) return;
    const ac = this.ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * 1.5, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    // fly buzz: two detuned saws through a bandpass, gain follows the fly count
    const g = this.buzzGain = ac.createGain(); g.gain.value = 0;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 3;
    for (const f of [196, 211]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(bp); o.start(); }
    bp.connect(g); g.connect(ac.destination);
  },
  // filtered noise burst: the building block for squelch, tear, slosh, scrape
  burst({ dur = .2, f0 = 800, f1 = 200, q = 1, type = 'lowpass', vol = .25 } = {}) {
    if (!this.on || !this.ac) return;
    const ac = this.ac, t = ac.currentTime, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noise; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t, Math.random()); src.stop(t + dur + .05);
  },
  squelch() { this.burst({ dur: .28, f0: 600, f1: 90, q: 6, vol: .35 }); },
  tear() { this.burst({ dur: .18, f0: 2400, f1: 900, q: 2, type: 'bandpass', vol: .2 }); },
  scrape() { this.burst({ dur: .07, f0: 3200, f1: 1800, q: 4, type: 'bandpass', vol: .06 }); },
  nick() { this.burst({ dur: .05, f0: 5200, f1: 4000, q: 12, type: 'bandpass', vol: .4 }); },
  slosh() { this.burst({ dur: .6, f0: 500, f1: 120, q: 2, vol: .3 }); },
  hiss() { this.burst({ dur: .5, f0: 3000, f1: 1500, q: .7, type: 'highpass', vol: .2 }); },
  setBuzz(v) { if (this.buzzGain) this.buzzGain.gain.setTargetAtTime(this.on ? v * .02 : 0, this.ac.currentTime, .3); },
};
$('#soundBtn').addEventListener('click', e => {
  SND.on = !SND.on; SND.init(); if (SND.ac.state === 'suspended') SND.ac.resume();
  e.currentTarget.setAttribute('aria-pressed', SND.on); e.currentTarget.textContent = SND.on ? 'Sound on' : 'Sound off';
});

/* ============================== 4. SCENE ============================= */
/* One canvas for every stage. A stage sets `scene` = { draw(ctx, t, dt), down(p), move(p), up(p), smell:[x,y] }.
   Pointer positions arrive already mapped to logical 900 x 560 coordinates. */
const cv = $('#cv'), ctx = cv.getContext('2d');
let scene = null, view = { s: 1, ox: 0, oy: 0, dpr: 1 }, pointer = { x: -99, y: -99, down: false, inside: false };
function fit() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const s = Math.min(r.width / W, r.height / H);
  view = { s, ox: (r.width - W * s) / 2, oy: (r.height - H * s) / 2, dpr, cw: r.width, ch: r.height };
}
new ResizeObserver(fit).observe(cv);
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - view.ox) / view.s, y: (e.clientY - r.top - view.oy) / view.s, t: performance.now() };
}
/* Map logical coords to CSS pixels inside the stage (for DOM overlays). */
function toScreen(x, y) { return { left: view.ox + x * view.s, top: view.oy + y * view.s }; }

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); Object.assign(pointer, toLogical(e), { down: true });
  if (SND.on && SND.ac && SND.ac.state === 'suspended') SND.ac.resume();
  scene?.down?.({ ...pointer });
});
cv.addEventListener('pointermove', e => { Object.assign(pointer, toLogical(e), { inside: true }); scene?.move?.({ ...pointer }); });
const endPtr = () => { if (!pointer.down) return; pointer.down = false; scene?.up?.({ ...pointer }); };
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', () => { pointer.inside = false; });

/* ---------- ambient FX: flies and smell lines, driven by the Stench meter ---------- */
const flies = [];
function drawFx(c, t, dt) {
  const src = scene?.smell || [450, 290];
  const want = S ? Math.floor(S.stench / 11) : 0;
  while (flies.length < want) flies.push({ x: src[0] + (Math.random() - .5) * 300, y: src[1] - 200, vx: 0, vy: 0, ph: Math.random() * 9 });
  while (flies.length > want) flies.pop();
  SND.setBuzz(Math.min(1, flies.length / 6));
  // smell lines: thin wavering strokes rising off the source
  if (S && S.stench > 22) {
    const a = Math.min(.45, (S.stench - 22) / 120);
    c.save(); c.strokeStyle = `rgba(110,118,62,${a})`; c.lineWidth = 2; c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const bx = src[0] - 60 + i * 60, ph = t / 900 + i * 2;
      c.beginPath();
      for (let k = 0; k <= 20; k++) {
        const u = k / 20, y = src[1] - 30 - u * 150 - ((t / 40) % 30), x = bx + Math.sin(ph + u * 6) * 10 * (1 + u);
        k ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.stroke();
    }
    c.restore();
  }
  // flies: wander, get pulled toward the source, land briefly
  c.save();
  for (const f of flies) {
    f.ph += dt;
    const ax = (src[0] - f.x) * .0009 + (Math.random() - .5) * .9, ay = (src[1] - 40 - f.y) * .0009 + (Math.random() - .5) * .9;
    f.vx = (f.vx + ax) * .93; f.vy = (f.vy + ay) * .93;
    f.x += f.vx * dt * 60; f.y += f.vy * dt * 60;
    c.fillStyle = 'rgba(20,22,18,.9)'; c.beginPath(); c.ellipse(f.x, f.y, 2.6, 1.8, Math.atan2(f.vy, f.vx), 0, 7); c.fill();
    c.fillStyle = 'rgba(200,210,220,.35)';
    const w = Math.sin(t / 12 + f.ph) * 2;
    c.beginPath(); c.ellipse(f.x - 1, f.y - 2, 2.4, 1.3 + w * .2, -.6, 0, 7); c.fill();
  }
  c.restore();
}

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  const c = ctx;
  c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  c.clearRect(0, 0, view.cw || 0, view.ch || 0);
  c.setTransform(view.dpr * view.s, 0, 0, view.dpr * view.s, view.dpr * view.ox, view.dpr * view.oy);
  if (scene?.draw) scene.draw(c, t, dt);
  drawFx(c, t, dt);
  if (scene?.cursor) scene.cursor(c, t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Shared art: a steel tray the specimen lies on. */
function drawTray(c) {
  c.save();
  c.fillStyle = '#c3c8c3'; c.strokeStyle = '#8f968f'; c.lineWidth = 3;
  c.beginPath(); c.roundRect(40, 40, 820, 480, 26); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2;
  c.beginPath(); c.roundRect(56, 56, 788, 448, 18); c.stroke();
  c.restore();
}
/* Blade cursor: a small scalpel drawn at the pointer. */
function drawBlade(c, p, color = '#d7dcdf') {
  if (!pointer.inside && !pointer.down) return;
  c.save(); c.translate(p.x, p.y); c.rotate(-0.7);
  c.fillStyle = color; c.strokeStyle = '#4b5155'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(10, -4); c.lineTo(26, -3); c.lineTo(26, 3); c.lineTo(8, 3); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#3e4447'; c.fillRect(26, -3, 34, 6);
  c.restore();
}

/* ============================== 5. STAGES ============================ */

/* "Continue" button whose enabled state is re-checked every frame via ready(). */

/* ---------- textures painted once at load ---------- */
function makeTex(paint) { const c = document.createElement('canvas'); c.width = W; c.height = H; paint(c.getContext('2d')); return c; }
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const TEX = {
  fur: makeTex(c => {
    const r = rng(7);
    c.fillStyle = '#7d7970'; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 26000; i++) {
      const x = r() * W, y = r() * H, a = -0.3 + r() * 0.6, L = 4 + r() * 7;
      c.strokeStyle = ['#5f5b54', '#99948a', '#b3ada2', '#3f3c37', '#86817a'][Math.floor(r() * 5)];
      c.lineWidth = .8; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); c.stroke();
    }
  }),
  belly: makeTex(c => {
    const r = rng(11);
    c.fillStyle = '#a49e92'; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 18000; i++) {
      const x = r() * W, y = r() * H, L = 3 + r() * 5;
      c.strokeStyle = ['#bdb7aa', '#8d877c', '#c9c3b6'][Math.floor(r() * 3)];
      c.lineWidth = .7; c.beginPath(); c.moveTo(x, y); c.lineTo(x + L * .3, y + L); c.stroke();
    }
  }),
  meat: makeTex(c => {
    const r = rng(23);
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#93372f'); g.addColorStop(1, '#7c2b25');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // muscle fibres and fascia sheen
    for (let i = 0; i < 2600; i++) {
      const x = r() * W, y = r() * H, L = 18 + r() * 40, a = 0.15 + r() * 0.3;
      c.strokeStyle = r() < .5 ? 'rgba(60,15,12,.35)' : 'rgba(190,96,84,.35)';
      c.lineWidth = .8 + r(); c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); c.stroke();
    }
    for (let i = 0; i < 90; i++) {
      c.fillStyle = 'rgba(235,225,215,.12)'; c.beginPath(); c.ellipse(r() * W, r() * H, 10 + r() * 30, 3 + r() * 6, r() * 3, 0, 7); c.fill();
    }
    for (let i = 0; i < 160; i++) { // fat flecks
      c.fillStyle = 'rgba(232,214,160,.5)'; c.beginPath(); c.ellipse(r() * W, r() * H, 2 + r() * 6, 1 + r() * 3, r() * 3, 0, 7); c.fill();
    }
  }),
};

/* ---------- ventral raccoon (stages 1-3) ---------- */
/* Layout of the animal on its back, head left. Regions are what you peel in stage 2. */
const VR = {
  head: [185, 290, 70, 56], body: [455, 290, 212, 116],
  legs: { foreL: [318, 200, 282, 92, 22], foreR: [318, 380, 282, 488, 22], hindL: [592, 205, 644, 92, 26], hindR: [592, 375, 644, 488, 26] },
  tail: [[652, 290], [720, 300], [792, 294], [870, 306]],
  incision: [[252, 290], [650, 290]],
};
function inEll(p, [x, y, rx, ry]) { return ((p.x - x) / rx) ** 2 + ((p.y - y) / ry) ** 2 <= 1; }
function tailDist(p) { let d = 1e9; for (let i = 0; i < 3; i++) d = Math.min(d, distSeg(p.x, p.y, ...VR.tail[i], ...VR.tail[i + 1])); return d; }

/* draw the whole carcass. o.peel = {region: 0..1}; o.skinned = everything peeled; o.cavity = draw opened belly. */
function drawVentral(c, t, o = {}) {
  const D = DECOMP[S.decomp || 'fresh'], bloat = S.decomp === 'bloated' ? 1.1 : S.decomp === 'dried' ? .93 : 1;
  const [bx, by, brx, bry] = VR.body, bodyP = ellPath(bx, by, brx, bry * bloat);
  const peel = o.peel || {}, P = id => o.skinned ? 1 : (peel[id] || 0);
  const legPath = k => { const [x1, y1, x2, y2, r] = VR.legs[k]; return capPath(x1, y1, x2, y2, r); };
  const tailP = new Path2D(); // tail as a tapered chain
  for (let i = 0; i < 3; i++) tailP.addPath(capPath(...VR.tail[i], ...VR.tail[i + 1], 18 - i * 4));
  const headP = ellPath(...VR.head); headP.addPath(polyPath([[130, 262], [100, 284], [100, 296], [130, 318]]));
  c.save();
  // shadow
  c.fillStyle = 'rgba(40,44,42,.18)'; c.beginPath(); c.ellipse(470, 312, 330, 150, 0, 0, 7); c.fill();
  // meat underneath everything
  const all = new Path2D(); all.addPath(bodyP); all.addPath(headP); all.addPath(tailP);
  for (const k in VR.legs) all.addPath(legPath(k));
  c.save(); c.clip(all); c.drawImage(TEX.meat, 0, 0);
  if (S.decomp === 'bloated') { c.fillStyle = 'rgba(90,110,50,.25)'; c.fillRect(0, 0, W, H); }
  if (S.decomp === 'dried') { c.fillStyle = 'rgba(70,40,20,.35)'; c.fillRect(0, 0, W, H); }
  c.restore();
  // fur, peeled back from the incision outward. Inner hide edge drawn pale.
  const furLayer = (path, tex, revealClip) => {
    c.save(); c.clip(path);
    if (revealClip) { const r = new Path2D(); r.rect(0, 0, W, H); r.addPath(revealClip); c.clip(r, 'evenodd'); }
    c.drawImage(tex, 0, 0); c.restore();
  };
  // flanks: reveal band grows from midline
  for (const [id, sign] of [['flankL', -1], ['flankR', 1]]) {
    const half = new Path2D(); half.rect(0, sign < 0 ? 0 : by, W, H / 2 + (sign < 0 ? by - H / 2 : 0));
    c.save(); c.clip(half);
    const band = P(id) * (bry * bloat + 4), rev = new Path2D(); rev.rect(0, sign < 0 ? by - band : by, W, band);
    furLayer(bodyP, TEX.belly, P(id) >= 1 ? fullRect() : rev);
    if (P(id) > 0 && P(id) < 1) hideEdge(c, bx - brx, by + sign * band, bx + brx, by + sign * band);
    c.restore();
  }
  // legs: reveal from the body outward
  for (const k in VR.legs) {
    const [x1, y1, x2, y2, r] = VR.legs[k], u = P(k);
    if (u >= 1) continue;
    const sx = x1 + (x2 - x1) * u, sy = y1 + (y2 - y1) * u;
    c.save(); c.clip(capPath(sx, sy, x2, y2, r)); c.drawImage(TEX.fur, 0, 0); c.restore();
    c.fillStyle = '#2f2c28'; c.beginPath(); c.ellipse(x2, y2, r * .8, r * .7, 0, 0, 7); c.fill(); // paw pad
    if (u > 0) { c.strokeStyle = '#e6d9c6'; c.lineWidth = 3; c.beginPath(); c.arc(sx, sy, r, 0, 7); c.stroke(); }
  }
  // tail: reveal from base, keep the rings
  {
    const u = P('tail');
    if (u < 1) {
      c.save(); c.clip(tailP);
      const cut = new Path2D(); cut.rect(652 + u * 220, 0, W, H); c.clip(cut);
      c.drawImage(TEX.fur, 0, 0);
      c.fillStyle = 'rgba(30,28,25,.75)';
      for (let i = 0; i < 6; i++) { c.fillRect(672 + i * 34, 250, 14, 100); }
      c.restore();
    }
  }
  // head: reveal from the neck toward the nose
  {
    const u = P('head');
    if (u < 1) {
      const keep = new Path2D(); keep.rect(0, 0, 258 - u * 175, H);
      c.save(); c.clip(headP); c.clip(keep); c.drawImage(TEX.fur, 0, 0);
      // mask and ears so it reads as a raccoon
      c.fillStyle = 'rgba(28,26,24,.85)'; c.beginPath(); c.ellipse(165, 258, 22, 13, -.3, 0, 7); c.ellipse(165, 322, 22, 13, .3, 0, 7); c.fill();
      c.fillStyle = '#e8e4da'; c.beginPath(); c.ellipse(104, 290, 6, 5, 0, 0, 7); c.fill();
      c.restore();
      if (u > 0) hideEdge(c, 258 - u * 175, 240, 258 - u * 175, 340);
    }
    if (u < .7) { c.fillStyle = '#4a4640'; c.beginPath(); c.ellipse(222, 230, 14, 18, -.5, 0, 7); c.ellipse(222, 350, 14, 18, .5, 0, 7); c.fill(); }
  }
  // dried carcass: sunken ribs showing through
  if (S.decomp === 'dried' && !o.skinned) {
    c.strokeStyle = 'rgba(50,40,30,.25)'; c.lineWidth = 3;
    for (let i = 0; i < 8; i++) { c.beginPath(); c.arc(330 + i * 22, 290, 80, -1, 1); c.stroke(); }
  }
  // wet sheen on exposed meat
  if (o.skinned || Object.values(peel).some(v => v > 0)) {
    c.save(); c.clip(all); c.globalCompositeOperation = 'screen';
    const sh = c.createRadialGradient(400 + Math.sin(t / 2500) * 40, 250, 10, 420, 270, 220);
    sh.addColorStop(0, S.decomp === 'dried' ? 'rgba(255,240,220,.05)' : 'rgba(255,240,235,.22)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sh; c.fillRect(0, 0, W, H); c.restore();
  }
  c.restore();
}
function fullRect() { const r = new Path2D(); r.rect(-10, -10, W + 20, H + 20); return r; }
function hideEdge(c, x1, y1, x2, y2) { c.save(); c.strokeStyle = '#eadfcf'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.restore(); }

/* ======================= STAGE 1: PREP & SAFETY ====================== */

function drawShrouded(c) {
  c.save(); c.fillStyle = '#3c4f5c'; c.beginPath(); c.ellipse(470, 300, 320, 150, 0, 0, 7); c.fill();
