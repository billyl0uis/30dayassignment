<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30-Day Assignment</title>
<meta name="description" content="Everything made for the 30-day assignment, numbered in the order it was made.">
<style>
  :root {
    --bg: #f6f2ec;
    --card: #fffdf9;
    --ink: #1f1a15;
    --muted: #6d6358;
    --line: #e2d9cc;
    --accent: #c4581a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15120f;
      --card: #1e1a16;
      --ink: #f1e8dc;
      --muted: #a39789;
      --line: #342d26;
      --accent: #ff9b3d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; letter-spacing: -0.01em; }
  .intro { margin: 10px 0 28px; color: var(--muted); max-width: 36em; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; list-style: none; margin: 0; padding: 0; }
  .card {
    display: flex; flex-direction: column; height: 100%; padding: 18px 18px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { color: var(--accent); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card h2 { margin: 2px 0 0; font-size: 18px; }
  .card p { margin: 6px 0 14px; color: var(--muted); font-size: 14px; flex: 1; }
  .open { color: var(--accent); font-size: 13px; font-weight: 600; }

  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>30-Day Assignment</h1>
  <p class="intro">Everything I've made for the 30-day assignment, in the order I made it. Each project opens in its own tab.</p>

  <ol class="grid" id="projects"></ol>

  <footer>Source on <a href="https://github.com/billyl0uis/30dayassignment">GitHub</a>.</footer>
</main>

<script>
  // In the order they were made. Add new projects to the end.
  const PROJECTS = [
    ['Tuxedo Tail', 'tuxedo-tail/', 'Stroke a tuxedo cat from head to tail tip, and the tail grows a little each time, up to an Olympic pool.'],
    ['InstaFace', 'instaface/', 'A big-text social feed for older people. Everything works, but posts stay on your device and pretend friends reply.'],
    ['Silverbench', 'silverbench/', 'Cut, solder, rivet and finish sterling on a soldering board, with guided lessons and 3D hinges and clasps.'],
    ['Foldline', 'foldline/', 'Fold-forming: fold a blank, hammer the edge, anneal and open it, and watch the form rise in 3D.'],
    ['Goblet Works', 'goblet-works/', 'Gather, blow, pull a stem, paddle a foot and open the rim to make goblets, then keep them on a shelf.'],
    ['Clean Bones', 'clean-bones/', 'Clean a rabbit skeleton with beetles, superworms or maceration, then degrease, whiten and lay it out.'],
    ['Carcass', 'carcass/', 'Start with a whole raccoon: skin, gut, deflesh and macerate, with every mistake carried to a museum grade.'],
    ['Vitrigraph Lab', 'vitrigraph-lab/', 'Load a vitrigraph pot, heat it, pull cane by hand, then chop it to see the murrini cross-sections.'],
    ['Glass Blocks', 'glass-blocks/play/', 'Stack shape presets on a center axis, stretch, squash and taper them, and see them as glass in 3D.'],
    ['Jackline', 'jackline/play/', 'Draw half a vessel profile and it spins into hollow 3D glass, with capacity, weight and tipping checks.'],
    ['Glass CAD', 'glass-cad/play/', 'Size glass parts in inches or centimetres, stack, cut, melt and deform them, and print a shop sheet.'],
    ['Glass Mash', 'glass-mash/play/', 'A glass sketchbook: draw shapes flat and they inflate into 3D glass you can melt together and carve.'],
    ['Finial', 'finial/play/', 'Plan hand-blown lidded jars: body and lid profiles, wall thickness, lid fit, capacity and a shop sheet.'],
    ['Flacon', 'flacon/play/', 'Plan hand-blown perfume bottles: neck and stopper, capacity in ml with a fill line, and risk checks.'],
    ['Pulled Pony', 'pony/', 'Pull legs, neck and tail from a gather before the glass cools. Reheat in the glory hole, then anneal.'],
    ['Paint Mixer', 'paint-mixer/', 'Mix a target color from the paints you own: photograph swatches, pick a color, then check your real mix.'],
    ['Armature', 'armature/play/', 'Build a metal frame, hang glass on it, blow glass into a wire cage, and check if it holds together.'],
  ];

  const list = document.getElementById('projects');
  PROJECTS.forEach(([name, href, blurb], i) => {
    const li = document.createElement('li');
    li.innerHTML = `<a class="card" href="${href}" target="_blank" rel="noopener">
      <span class="num"></span><h2></h2><p></p><span class="open">Open ↗</span>
    </a>`;
    li.querySelector('.num').textContent = String(i + 1).padStart(2, '0');
    li.querySelector('h2').textContent = name;
    li.querySelector('p').textContent = blurb;
    list.append(li);
  });
</script>
</body>
</html>
