  const el = $(container);
  el.querySelectorAll(".chip").forEach((c) => c.remove());
  for (const [value, label, n] of options) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", String(state[key] === value));
    b.innerHTML = esc(label) + (n != null ? `<span class="n">${n}</span>` : "");
    b.onclick = () => { state[key] = value; state.shown = PAGE; render(); };
    el.appendChild(b);
  }
}

function matches(r, skip) {
  const q = state.q.trim().toLowerCase();
  if (q && !q.split(/\s+/).every((w) => r.title.toLowerCase().includes(w))) return false;
  if (skip !== "delivery" && state.delivery !== "all" && r.delivery !== state.delivery) return false;
  if (skip !== "area" && state.area !== "all" && r.search_location !== state.area) return false;
  if (skip !== "source" && state.source !== "all" && r.source !== state.source) return false;
  if (state.onlyNew && !r.is_new) return false;
  if (state.min !== "" && (r.price == null || r.price < +state.min)) return false;
  if (state.max !== "" && (r.price == null || r.price > +state.max)) return false;
  return true;
}

const count = (key, value) => ROWS.filter((r) => matches(r, key) && (value === "all" || r[key === "area" ? "search_location" : key] === value)).length;

function sorted(rows) {
  const by = {
    best: (a, b) => b.relevance - a.relevance || (a.price ?? 1e9) - (b.price ?? 1e9),
    "price-asc": (a, b) => (a.price ?? 1e9) - (b.price ?? 1e9),
    "price-desc": (a, b) => (b.price ?? -1) - (a.price ?? -1),
    newest: (a, b) => String(b.posted_at || "").localeCompare(String(a.posted_at || "")),
  }[state.sort];
  // Under "best match", listings no earlier search found come first.
  const fresh = (a, b) => state.sort === "best" ? !!b.is_new - !!a.is_new : 0;
  return [...rows].sort((a, b) => fresh(a, b) || by(a, b));
}

function grouped(rows) {
  if (!state.group) return rows.map((r) => ({ top: r, rest: [] }));
  const groups = new Map();
  for (const r of rows) {
    const k = groupKey(r);
    if (groups.has(k)) groups.get(k).rest.push(r); else groups.set(k, { top: r, rest: [] });
  }
  return [...groups.values()];
}

function card({ top: r, rest }) {
  const prices = [r, ...rest].map((x) => x.price).filter((p) => p != null);
  const range = rest.length && prices.length ? `<small>${money(Math.min(...prices))}–${money(Math.max(...prices))}</small>` : "";
  const where = [AREA_LABEL[r.search_location] || "Near " + r.search_location, r.location].filter(Boolean).join(" · ");
  const attrs = (r.attributes || []).filter((a) => !/^(fixed_price|auction|best_offer)$/.test(a)).slice(0, 5);
  if ((r.attributes || []).includes("auction")) attrs.unshift("auction");
  const similar = rest.length ? `
    <details class="similar"><summary>+ ${rest.length} similar listing${rest.length > 1 ? "s" : ""}</summary><ul>
      ${rest.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a> — ${money(x.price)}</li>`).join("")}
    </ul></details>` : "";
  return `<article class="card">
    <div class="price">${money(r.price)}${range}</div>
    <div>
      <a class="title" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
      <div class="meta">
        ${[r, ...rest].some((x) => x.is_new) ? `<span class="badge new">Just found</span>` : ""}
        <span class="badge d-${esc(r.delivery)}">${esc(DELIVERY[r.delivery] || r.delivery)}</span>
        <span>${esc(where)}</span>
        <span class="src">${esc(r.source)}</span>
        ${r.posted_at ? `<span>${ago(r.posted_at)}</span>` : ""}
      </div>
      ${attrs.length ? `<div class="chips">${attrs.map((a) => `<span>${esc(a)}</span>`).join("")}</div>` : ""}
      ${similar}
    </div>
  </article>`;
}

function render() {
  save();
  $("q").value = state.q; $("sort").value = state.sort; $("min").value = state.min; $("max").value = state.max; $("group").checked = state.group; $("onlynew").checked = state.onlyNew;

  chips("delivery", "delivery", ["all", "pickup", "both", "ship", "unknown"]
    .map((d) => [d, DELIVERY[d], count("delivery", d)]).filter(([d, , n]) => d === "all" || n > 0));
  const areas = [...new Set(ROWS.map((r) => r.search_location))].sort((a, b) => (a === "Ships nationwide") - (b === "Ships nationwide"));
  chips("area", "area", [["all", "All", count("area", "all")], ...areas.map((a) => [a, AREA_LABEL[a] || a, count("area", a)])]);
  const sources = [...new Set(ROWS.map((r) => r.source))];
  chips("source", "source", sources.length > 1 ? [["all", "All sites"], ...sources.map((s) => [s, s === "ebay" ? "eBay" : s[0].toUpperCase() + s.slice(1)])] : []);

  const groups = grouped(sorted(ROWS.filter((r) => matches(r))));
  const listings = groups.reduce((n, g) => n + 1 + g.rest.length, 0);
  $("count").textContent = groups.length
    ? `${groups.length} result${groups.length > 1 ? "s" : ""}` + (listings !== groups.length ? ` (${listings} listings, repeats combined)` : "")
    : "";
  $("list").innerHTML = groups.length
    ? groups.slice(0, state.shown).map(card).join("")
    : `<div class="empty">Nothing matches these filters.</div>`;
  $("more").hidden = groups.length <= state.shown;
}

const when = new Date(DATA.generated_at);
const NEW = ROWS.filter((r) => r.is_new).length;
$("sub").textContent = `${ROWS.length} listings · searched ${when.toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}`
  + (NEW ? ` · ${NEW} just found since the search before` : "");
$("onlynew-wrap").hidden = !NEW;
$("newn").textContent = NEW ? `(${NEW})` : "";
if (!NEW) state.onlyNew = false;   // a saved "only new" from last time would hide everything
$("q").oninput = (e) => { state.q = e.target.value; state.shown = PAGE; render(); };
$("sort").onchange = (e) => { state.sort = e.target.value; render(); };
$("min").oninput = (e) => { state.min = e.target.value; state.shown = PAGE; render(); };
$("max").oninput = (e) => { state.max = e.target.value; state.shown = PAGE; render(); };
$("group").onchange = (e) => { state.group = e.target.checked; render(); };
$("onlynew").onchange = (e) => { state.onlyNew = e.target.checked; state.shown = PAGE; render(); };
$("more").querySelector("button").onclick = () => { state.shown += PAGE; render(); };
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });
render();
</script>
</body>
</html>
